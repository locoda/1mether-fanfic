# Pages CMS 配置：https://pagescms.org
# 用 GitHub 账号登录 https://app.pagescms.org ，选这个仓库，就能在网页上写作品。
# 保存后会自动提交到仓库，Cloudflare Pages 随后自动重新部署。
#
# 一篇作品 = src/content/works/ 下的一个文件夹：
#   index.yml   作品信息（后台「作品」里编辑）
#   01.md ……    章节（后台「章节」里编辑），单章作品也有一个章节

content:
  # ---------- 作品：只有作品信息，没有正文 ----------
  - name: works
    label: 作品
    type: collection
    path: src/content/works
    subfolders: true
    # 新建作品时，文件名会按标题生成「标题/index.yml」，也可以自己改，例如「my-work/index.yml」
    filename:
      template: "{primary}/index.yml"
      field: create
    view:
      layout: tree
      node:
        filename: index.yml
        hideDirs: nodes
      primary: title
      fields: [title, cp, updated]
      sort: [updated, title]
      search: [title, cp, series]
      default:
        sort: updated
        order: desc
    fields:
      - name: title
        label: 作品名
        type: string
        required: true

      - name: cp
        label: CP
        type: string
        list: true
        description: 可以填多个

      - name: updated
        label: 更新日期
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
        description: 决定首页排序

      - name: summary
        label: 简介
        type: text
        description: 不填就自动取正文开头

      - name: series
        label: 系列
        type: string
        description: 系列名完全相同的作品会自动归在一起

      - name: seriesOrder
        label: 系列里的第几篇
        type: number

      - name: status
        label: 连载状态
        type: select
        options:
          values:
            - { name: ongoing, label: 连载中 }
            - { name: finished, label: 已完结 }
        description: 不填就不显示

  # ---------- 章节：只有章节名、第几章和正文 ----------
  - name: chapters
    label: 章节
    type: collection
    path: src/content/works
    subfolders: true
    # 先点进作品的文件夹，再新建章节；文件名随意，顺序和网址只看「第几章」
    filename:
      template: "{order}.md"
      field: create
    view:
      primary: title
      fields: [title, order]
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: 章节名
        type: string
        description: 单章作品填作品名就行

      - name: order
        label: 第几章
        type: number
        description: 1、2、3……决定章节顺序和网址；单章作品填 1

      - name: body
        label: 正文
        type: text
        description: 空一行是分段；作者注写在 <aside class="author-note" aria-label="作者注"> 和 </aside> 之间
