# 自动检查：开 PR、往 PR 里推新提交时运行，结果显示在 PR 页面下方（绿勾 / 红叉）。
# 检查内容见 scripts/check.mjs，本地运行 npm run check 是同一套检查。
name: 自动检查

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: 检查
        run: npm run check
