# 作品有更新时（包括在 Pages CMS 里保存），自动把所有作品导出成 Markdown 放到 export/。
# 导出的提交带 [skip ci]，不会再触发 Cloudflare Pages 构建，也不会再触发这个工作流。
name: 导出 Markdown

on:
  push:
    branches: [main]
    paths:
      - 'src/content/works/**'
      - 'scripts/export-md.mjs'
      - 'scripts/lib/work-md.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: export-md
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - run: npm run export

      - name: 提交导出结果
        run: |
          git add export
          if git diff --cached --quiet; then
            echo "导出内容没有变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: export works to Markdown [skip ci]"
          # 导出期间如果又有人保存了作品，先接上最新的 main 再推
          git pull --rebase origin main
          git push
