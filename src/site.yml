# 网站设置。可以直接改这个文件，也可以在网页后台（Pages CMS）的「网站设置」里改。
# 没写的项目会用默认值。

# 站名，显示在刊头和浏览器标签上
title: 1mether 的同人站
# 页脚的一行小字，可留空
tagline: 同人作品存档
# 作者名，用在署名和页脚
author: 1mether
# 网站简介，搜索引擎和分享链接时显示
description: 1mether 的同人作品存档。
# 页面语言，影响排版与读屏
lang: zh-CN
# 页脚的外部链接，例如：
#   - label: AO3
#     href: https://archiveofourown.org/users/xxx
links: []
# 每页显示多少篇作品（首页、CP 页通用）
perPage: 20
# 阅读速度（字/分钟），用来估算阅读时长
readingSpeed: 500

# 功能开关：true 打开，false 关闭
features:
  # 首页第一页把最新一篇做成大标题头条
  leadStory: true
  # 正文第一个字放大（首字下沉）
  dropCap: true
  # 完结章最后一段末尾加 ♦
  endMark: true
  # 章节页顶部的阅读进度条
  progressBar: true
  # 显示字数（列表、系列页、章节页）
  wordCount: true
  # 显示预计阅读时长（章节页、首页头条）
  readingTime: true
  # 标题下的「文 / 作者」署名
  byline: true
  # 多章作品：点「第 N 章 / 共 M 章」弹出章节菜单
  chapterPicker: true
  # 键盘 ← → 翻章
  keyboardNav: true
  # 文末「更多同 CP 作品」推荐
  related: true
  # 没写简介（summary）时，列表里自动显示正文开头
  autoSummary: true
  # 深色模式：auto 跟随系统并显示切换按钮；system 只跟随系统、不显示按钮；off 始终浅色
  darkMode: auto
