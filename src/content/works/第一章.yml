    被困在一个房间里不是小说电影里才会出现的情节，是强制居家令下达之后不得不面对的现实。

    那天长谷川慎比吉野北人还要晚醒来，也没什么不对的。家主人不乐意多穿衣服，硬是要穿着短裤短袖晃来晃去，仗着有地暖连鞋都不穿，长谷川慎看在眼里，也没资格介意。反正他也不是非要穿拖鞋的人。

    “你好像走不了了。”这是吉野北人早上对长谷川慎说的第一句话。长谷川慎想，这应该算是夸大其词。

    居家令确实是下了，手机上也能看到新闻，但也没说一定不能出门。虽然吉野北人住的公寓应该会稍稍加强把控，但怎么也不至于把不属于住户目录上的人强行留下。

    但长谷川慎点了点头，顺着话头说那也是没办法的事情，然后话锋一转问吉野北人有没有自己能穿的衣服。

    长谷川慎得比吉野北人大上两个码，这基本上就不是oversized的衣服可以解决的问题了。吉野北人问他不穿衣服很冷吗，长谷川裸着上半身回答说你家这是温室，这温度不仅不冷还会长高呢，于是被吉野说还是别长高了，更没衣服穿了。话是这样说，还是从客厅走到卧室，在长谷川慎的眼前蹲下，从抽屉里一件件拿出平时不常穿的衣服看大小。

    自己的衣服被丢进洗衣机快速清洗的时候，长谷川扯着吉野的衣服问他真的没有更大的了吗，吉野只说别扯坏了。大概是真的没有。宽松的短裤倒是穿着也差不多，却总觉得衣服哪里都不对劲，等烘干机转完之前，长谷川慎又变回了半裸的状态，懒洋洋地窝在沙发里拽着毛巾毯看电视。吉野北人不知道从什么地方走过来让他把电视机调小点声，长谷川慎索性就拿起遥控器把电视机关了。

    “本来也没在看”，他说。虽然解释好像也没必要。

    烘干机那边响起音乐，吉野北人回来的时候手里拿着长谷川慎的长袖，所以长谷川慎说着谢谢伸过手去接。倒也没抬头看，所以接到的不是衣服而是一整个人是会吃惊的。刚从烘干机里拿出来的衣服比体表的温度还要高一些，吉野北人把衣服往上面递了递，在长谷川慎能接到前又改变主意似的把衣服丢出去了。长谷川慎知道家里的地很干净，也知道这只是吉野北人的小把戏，但吉野北人设多少次陷阱长谷川慎都会选择往里跳，应该不是因为无事可干。

    没有真的生气，但是会把吉野北人按在沙发上。那个时刻居家还是新鲜事，只觉得不需要工作却还照常能拿工资，也没什么地方耗费精力。所以明明前一夜做了，现在也还是要做。他可是吉野北人啊，多少次都可以，在哪里都可以，什么时候都可以。手从宽大的裤腿里伸进去，才发现对方连内裤都没好好穿，往后穴一摸一手潮湿，长谷川慎在心里讲好骚，没能说出口。明明说出来吉野北人也不会生气的，只会变本加厉。

    昨晚其实做得比平时激烈了点，吉野北人的锁骨上留下的咬痕是证据。酒精只是借口，实际上为什么只有天晓得，反正就当是本性使然吧。长谷川慎不用手去摸锁骨，只是又用牙齿去碰。吉野北人不推他也不喊疼，只是往反方向伸了下脖子，像是邀请人继续。在这样的时候长谷川慎反而想变得温柔一些，要用手把后穴玩到软透了才肯继续下一步，在人的身上只是用舌头轻佻地转悠着，不打算留下一点痕迹的样子。

    “反正今天不上班”，吉野北人说，“明天也不上班。”长谷川慎装作听不懂。

    也说不清是因为没什么好聊所以总在做爱，还是因为总在做爱所以也没聊什么，身体之间的距离太近了，别的什么都远。总觉得有两三天过得很恍惚，明明也不是时时刻刻都在做爱，但好像生活被什么东西吃掉了一块，怎么也记不起来具体做了什么别的事情。大概做爱真的会把脑子做到坏掉。

    意识到居家令还要持续一段时间的时候，长谷川慎就在网上买了几件短袖送吉野北人家。没有平时那种挑挑拣拣的，只是在网上找能快点送到的，差不多能穿就行了。只是连送货上门的服务都缺人到不行，就算是平时几小时能送到的东西也要拖上两天才能送到。早上还睡着，被门铃叫醒，长谷川慎戴上口罩才敢打开门签名。接过袋子利索地拆开，可穿上了新衣服也还是觉得哪里不对劲，但算了，先凑合凑合吧。

    吉野北人过了会儿才醒来，迷迷瞪瞪地问长谷川慎刚刚是有人来过吗，然后上下打量了一下走到房门口的人，想说什么似的张了张嘴。但他没说话就闭上了嘴，只是从被子里伸出手揉了揉眼睛。长谷川慎确实猜不到他想说什么，但他也不太好奇。他们之间的对话常常就是这样，还没有开始就已经结束了。

    也有莫名其妙聊了起来的时候，比如说后来哪天早上吉野北人突然问“不会真的被认为是聚众吧？”长谷川慎说报数，吉野北人说1，长谷川慎说2，长谷川慎问“众在哪里？”，吉野北人跑到鱼缸边上捏着鼻子说3，长谷川慎说3个也不算太多。吉野北人弯腰从柜子里拿出鱼食，往鱼缸里一颗一颗扔进去，长谷川慎看他开始对鱼缸里的鱼说话，就不再管他了，也不关心他在和鱼说什么，只是想吉野北人好像比鱼吃得还要少。

    好像也不完全不担心，但是好像也没有理由加以干涉。没见过他家冰箱里有蔬果和肉类，堆着的只有各种各样的饮料，倒是含酒精和无酒精的都有，可长谷川慎不记得吉野北人是个喜欢邀请别人回家的人。倒是有吃不完的各种各样的聚会装膨化食品，也有堆满柜子的巧克力和蛋白棒，饿是饿不死的，但长谷川慎跟着吉野北人昼夜颠倒吃了几天还是有些受不了了。吉野北人说你想点外卖的话就点吧，反正外卖软件还能用。长谷川慎问吉野北人吃什么，吉野北人打开手上拿着的啤酒说吃巧克力，长谷川慎说真的不吃点寿司吗，反正我也要点的，吉野北人只是摇头。

    明明啤酒和巧克力根本一点也不相配。

    他最后还是只下单了自己吃的分量的寿司，点了提交订单之后才开始像慢慢从梦里醒来似的。突然觉得搞不懂自己为什么还在这里，怎么连不合身的衣服都穿习惯了。长谷川慎想，做爱都要做腻了，是不是该离开了。那就等吃完外卖吧，到时候把垃圾带出去，然后回自己家。空调不用开那么暖，穿长袖长裤，要穿拖鞋，电视声音也可以开大一些。

    他吃寿司的时候吉野北人就在对面一口啤酒一口巧克力地吃，然后没吃完一半就把巧克力丢桌上人不见了。长谷川慎的寿司点多了，并不是故意的，所以也就剩了没几个。他想着等吉野北人回到餐桌边上再问他吃不吃，于是用筷子敲着外卖盒等着。也不敢敲得重了，本来外卖盒子看起来也不怎么稳，吃了一大半之后更有失衡的倾向，结果只能制造一些若有若无的噪音，仅此而已。

    吉野北人回到餐桌边上的时候带着一盒拼图。长谷川慎问他吃不吃寿司，他说不吃了，来玩拼图吧。长谷川慎想了想，说好，然后就把本来想的事情都放一边去了。没吃完的寿司被说占了桌子地方被丢进垃圾桶，但剩下的巧克力和啤酒却还留着，长谷川慎没说一句不公平，只是在吉野北人拆拼图的时候就把桌子擦干净了。吉野北人往桌上倒拼图的时候根本不看桌子是不是脏的，就像他没问过长谷川慎是不是和别人做过爱，也从不会要长谷川慎戴套，倒是为人始终一致。

    倒完拼图块长谷川慎才发现拼图块全是白色的。吉野北人把拼图外包装盒拿给他看，长谷川慎看到上面明晃晃地写着“纯白地狱”。长谷川慎问吉野北人之前有没有拼过拼图，吉野北人说没有拼完过，大概是尝试过的意思。长谷川慎问这个是不是太难了些，哪有新手拼这个的。

    “可是纯白的比较好看啊”，吉野北人只是耸了耸肩。

    “地狱啊……”长谷川慎小声感叹着。但他在想，什么时候和这人已经到了连地狱都能一起下的关系，真好笑。

    吉野北人说要拼正面，长谷川慎说就是因为拼正面你才从来都拼不完，还是拼背面吧。没争出结果，但吉野北人好像没想要动手，所以事情就按照长谷川慎的想法做。虽然背面也只是图案的单调重复，圆圈三角方块爱心，至少能分成四堆。长谷川慎不知道哪里来的干劲埋头分拼图，吉野北人只是在旁边喝啤酒而已。这拼图块太小了，他只好把头埋下去一点，一块一块继续检阅。视野里出现另一只手，在长谷川慎的工作区域内丢下一块拼图，感觉没有放在正确的类别里，但比起纠正拼图，长谷川慎还是决定先纠正人。

    抓住那只手好像是抓住犯人，长谷川慎不松手，吉野北人好像也没打算挣脱。起身想越过桌子制裁对方，但又小心翼翼地不想毁掉刚才的工作成果，动作不太流畅。

    “换个地方吧？”

    当然是可以的。所以放下弄到一半的拼图不管，又滚到床上去了。吉野北人叫长谷川慎关灯，长谷川慎说不要。吉野北人说灯好亮，会掉眼泪，长谷川慎说那我们换个位置。然后就真的换了个位置。长谷川慎躺下的时候觉得灯真的很刺眼，晃得脸吉野北人的脸也看不清了，好像连开着灯的意义都没有了，但动作却还是在继续。长谷川慎用手挡眼睛，为了挡灯光挡去大半视线，只能看见吉野北人的腰身。长谷川慎故意说看不见，吉野北人就自己把那关节分明的手往后探，自己扩张自己，刚开始只是动手，然后腰肢也跟着动起来。

    长谷川慎大概是很想看他的脸，想到忍不住咽了口水。吉野北人握着他的小臂把他的手掰开，用自己的脸占据长谷川慎的整个视野，他和长谷川慎对视，瞳孔深得望不到底。做下去，坐下去，里面也深得探不到底。不知道是地狱的火更热还是眼前的人更热，长谷川慎只知道地狱是有底的，但欲望不见得有。

    第二天在餐桌前吃早饭的时候，长谷川慎觉得有哪里不对劲。他接过吉野北人递过来的咖啡放到桌上，喝了一口才想起来问吉野北人拼图去哪了。吉野北人指了指沙发，长谷川慎看到又混回一起去的拼图块无情地堆在盒子里。

    “这样下去的话拼不完的吧……”长谷川慎下意识地用手指搅起了拼图，搅了一圈才意识到自己只是徒增混乱程度。但这个时候停下好像也来不及了，不如就继续搅动吧。

    “那又怎么样呢？”

    嗯，确实是无所谓的。

    居家也好，拼图也好。感情也好，故事也好。
