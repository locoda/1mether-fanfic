title: 更喜欢天空的人
cp:
- 世界树
updated: 2025-04-27
status: finished
chapters:
- title: 更喜欢天空的人
  body: |
    01

    在知道佐藤大树的名字是佐藤大树之前，山本世界就被他问过“你更喜欢天空还是更喜欢大海？”

    山本世界那时没有回答他的问题，反倒是问醉醺醺的他“你几岁了？”

    眼前的人看起来实在是有些可疑。山本世界刚出来透气的时候他还靠墙站着，逐渐就沿着墙滑了下去。眼看他就要跌坐到地上，山本世界上去拉住了他的手腕——山本世界没想到，他的手腕那么细，竟然用手一下就能圈住。他站的地方避开了灯光，刚才也没能看清他的脸，靠近了才发现他是高中生的模样。不，山本世界想，如果他穿上初中校服，说自己是初中生，恐怕自己也会相信。下意识地问出“你几岁了”，大脑才缓慢地处理了他刚才抬起头问出的毫不相关的问题。

    对方散漫的眼神慢慢聚焦到自己的脸上，山本世界确定对方听见了自己的问题，可对方没有马上回答。对视，一秒，两秒，对方笑了起来，轻轻说，“我只告诉你哦，再过三个月就二十岁了。”

    好危险，是麻烦的事情。山本世界觉得应该立刻松手离开这个人这个地方，可对方的双眼游移着离开了山本世界，落到了地面上。一种引力拉住了山本世界，让他无法果断地挪开双腿，只好随着对方的视线飘向地面。

    “所以呢，你是更喜欢天空还是更喜欢大海呢？”

    山本世界没有立刻回答，只是顺着心意蹲了下来，慢慢抬起了自己的头。视线越过树叶越过高楼，深邃的背景望不见底。山本世界松开了那只握住对方手腕的手，“天空。”

    对方哈出的气在空气中形成白色的雾气，原来已经这么冷了。山本世界听到他的话语中带着笑意，“我是不会和更喜欢天空的人做朋友的。”

    02

    直到一小时后，山本世界才知道了他的名字。到他家门口的时候，“山本”的门牌被读了出来，然后接着是“好无聊的姓喔”的评价。山本世界忍不住反驳是自己的名字可是世界呢，要不是普通的姓也太奇怪了。男孩说是是是，被山本世界问起姓名的时候回答“佐藤”。山本世界没忍住吐槽说那不是比山本更无聊的姓吗，佐藤抓起他的手，在手心一笔一画写下“大树”两个字，又说“我下面的名字也很酷吧！”

    山本世界不太明白大树这个名字酷在哪里，至少他觉得怎么都不会比世界更酷，但他还是把佐藤大树放进了自己家门。

    山本世界不觉得自己有义务把人带回家，也不觉得自己应该把人带回家，甚至怀疑自己是不是做错了，可一切的时机都刚刚好。带他去聚餐的同事刚好散场走出来，刚好在商量时看到了蹲在墙边的山本世界，刚好问他要不要去下一摊。山本世界也只是刚好用了“遇到以前认识的人叙叙旧”这样的借口糊弄过去，就拉着佐藤大树往外走，走着走着就顺理成章地回了家。明明对彼此一无所知到连名字都不了解，山本世界没来由地选择了信任，大概要算在那双眼睛的份上。

    “可以先借用你的浴室吗？”大树观察了一下房间，伸着脖子问山本世界，“冲个澡醒一醒酒。”

    山本世界答应了，给他指了浴室的位置还拿来了干净毛巾。不过他没能醒着等到佐藤大树洗完澡出来的时候，就一个人睡了过去。

    看来这些似乎不对劲的事情还是应该都算在酒精的份上。

    03

    再见到佐藤大树就是一个月后的事了。季节从夜里会感到冷的深秋彻底滑入冬季，连山本世界在每天出门时也都要穿上厚外套了。从家走到舞室的路没有多长，抵达的时候身体微微发热的程度刚好。

    以“一定会参加忘年会”为托辞，山本世界打算推掉这一个月的饮酒活动。早早回到家里打开了游戏机和可乐，没想过到深夜时分竟然会听到敲门声。一开始那两下轻轻的，山本世界还以为自己出现了幻觉，继续打着游戏，又听到两声敲门，比刚刚更有力一些。打开门的时候，和那双眼眸对上，一个月前的一晚的回忆浮现出来，山本世界才确信那并不是自己在做梦。

    “能不能，让我住一晚……”山本世界觉得门外的人此时比上次遇见时更小，“我没注意时间，错过了末班车。今天打工的地方也不能过夜……所以……”

    山本世界说进来吧进来吧，没有追问他怎么能自己找到这里，也没有问他想住多久，就让他进来了。山本世界以为他和上次一样只会住一个晚上，第二天就会消失——事实上也确实如此。

    只是这个夜晚比之前那个漫长的多。山本世界没打算停下游戏，除了撂下一句“就把这当你自己家吧”以外也没作出什么更像样的待客举动。佐藤大树竟然真的自己在房间里转悠几圈找到了毛毯拿出了饮料，缩在离山本世界不远的角落里，甚至没什么存在感，把暂停游戏起来上厕所的山本世界吓了一跳。可山本世界犹豫了一下也没说什么，又走回了自己刚才的座位上，继续游戏。

    “我啊，好想跳过两个月，快点成年。”佐藤大树坐到了靠近的地方，用山本世界能听见的声音说。为什么呢，山本世界没停下手中的操作，有意无意地追问，“20岁比18岁也多做不了什么事。”

    在山本世界看不见的地方佐藤大树撅起了嘴，“20岁就可以喝酒了！这不是很重要吗！”

    “嘛，你现在也没有少喝。”山本世界还记得第一次见面时候对方那一身酒味。

    佐藤大树突然站了起来，“重要的是合法性！超过20岁就合法了！”

    山本世界在心里想那又怎么样呢，合法的不合法的，本来也没人在管，只有没到20岁的人才会在乎。

    04

    说来很幸运，山本世界在18岁的时候已经得到了自己最想要的东西——一个可以跳舞的地方，一群一起跳舞的人，一份可以维生的工作。更幸运的是，这三件事本就是同一件事。他不喜欢喝酒，也不用上晚班，20岁对他来说更像是诅咒而不是值得期待的事情。因为没觉得生活有什么不同的，所以山本世界也不太想得起来快要20岁的自己是怎么想的，恐怕对20岁生日也没什么特别的感觉，更别提留下什么印象深刻的记忆。

    反倒是佐藤大树这样一说，他突然算起了年纪，才发现距离20岁已有将近四年的时间。企图从脑海中翻出什么20岁之后的趣事，结果那之后的所有记忆和压缩饼干一样只是小小一块，上面打着“四年”的标签，也确实存在，不过没什么味道，也不值得分享。

    “你想做什么呢？”山本世界问。

    “我想再打份工！”佐藤大树说，“晚上打工的话时薪更高，白天可以上课，而且大概也能在东京租房，不用总是打扰别人或者回老家了。”

    “学习啊……很朝气蓬勃呢。”山本世界没停下手里的游戏，有一搭没一搭地应和。

    “啊，不是说读大学啦。”佐藤大树连忙解释，“我想学唱歌。”

    “喔？是吗？”

    “你不觉得用歌声传递心意是很浪漫的事情吗？”佐藤大树自顾自接着说，“我从小就一直这样觉得了，音乐啊、歌声啊，好像比说话更有力量，更容易抵达人心呢。”

    “啊，这样的话要不要学乐器呢？”

    “暂时没有买乐器的钱啦，啊……要是爸妈愿意出钱的话早就……”

    说着说着没了声音，山本世界一回头，发现佐藤大树突然地就这样睡着了。

    05

    周六是舞室最忙碌的日子，周一到周五下午才开始上课，周日下午放课早，只有周六不仅要早起还要上课到最后一节。山本世界醒来时已经是八点四十，衣柜里随便抓了两件能穿的衣服就冲出了门，抵达舞室刚好赶上九点的课。

    等晚上上完最后一节课已经超过了九点，还有学生要留下聊两句的，也要和其他老师寒暄几句。和熟识的舞室老板插科打诨，说一定要给自己开加班工资，老板说好好好，下个月忘年会你不用额外交钱，我请你吃。山本世界差点翻了白眼，毕竟他不喝酒，吃点东西又能花掉多少钱。不过本来也不是计较钱，迅速结束话题，回家才是正事。

    直到打开自己家门，昨夜这里曾住了另一个人的事才重新回到山本世界脑中。山本世界搜寻了早上出门时的记忆，却一点也想不起来那时候有没有看到一点佐藤大树的身影。冰箱里的饮料有没有少山本世界摸不清，倒是能确定他自说自话拿出来的毛毯叠好了放在地上，像是佐证他确实来过，而不是山本世界做的一场梦。不过就算是梦，山本世界也不觉得有什么可惜的。一个稍微有点有趣的人在他生活中也不过只是做菜时提鲜才放的一点点糖，做个家常菜不放也罢。

    在冷风中回的家，身上的汗已经干掉了，山本世界决定还是先不管了，进浴室冲了个澡，才重新回到房间里。打开电视拿起手柄，才发现手柄下面压着一张字条。

    「我一定会报恩的！这是我的手机号——」右下角端端正正署名佐藤大树。

    山本世界被这字条逗得几乎要笑出了声。

    可他没有联系对方，也没有记下电话号码。他想，如果佐藤大树觉得做不了朋友的话，他也绝不想要做对方的恩人。

    06

    山本世界没想到下一次见面就在短短一周后。伴随着咚咚咚的敲门声，山本世界脑子里冒出的第一个想法是怎么又来了，第二件事是拿出手机看时间——明明还没到没有末班车的点。

    “你怎么不回家？”山本世界问。

    “你为什么不联系我？”佐藤大树问。

    山本世界想说没有必要，但真的看到戴着围巾的佐藤大树顶着他那双写着委屈的双眼，又觉得说不出口了。于是也放弃了自己的质问，摆了摆手又把人放进了家里，反倒是佐藤大树不打算踏入他家门的样子。

    “手机给我！”佐藤大树伸出手，用理直气壮不由分说的语气要来了山本世界的手机。低下头按键后不久，他自己口袋里的手机响了起来。他用另一只手掏出手机挂断，继续在山本世界的手机上输入后，才把手机还给山本世界。“把我的号码存在通讯录了。”看山本世界接过手机端详的样子，佐藤大树又继续补充，“不许删除，不许拉黑！”

    其实没有任何效力，但山本世界轻轻点了点头表示自己答应了，可没想到佐藤大树还是没有要进门的意思。山本世界带着一丝疑惑看向他，只听到佐藤大树说“既然这件事解决了，那我就先回家了！要是没赶上末班车的话会再来打扰你的！”然后就像风一样地离开了山本世界的房间门口。

    山本世界觉得有点哭笑不得。只是要个电话号码的话，对方好像不必专门跑这么一趟，可不跑这么一趟，对方大概下次错过末班车前也得不到自己的电话。山本世界问自己，如果是自己的话要怎么做，可他想不出答案。他想不起上次想要别人的电话号是什么时候，也想不起上次没有被邀请就出现在别人家是什么时候，他或许本来就不会这么做。

    07

    到了十二月中旬的时候，街上的节日气息已经饱和到溢了出来。即便是对节日没什么兴趣的山本世界，也不得不被动接受圣诞节快要到了这一事实。忘年会定在下周，舞室在那之后就彻底进入新年假期模式。比起礼物之类的，山本世界跟想要可以自己呆在家什么都不用想的时间。

    某个周中的晚上佐藤大树打来电话，毫无征兆。山本世界一边想着没礼貌一边接起了电话，听到对方劈头盖脸问自己要什么圣诞节礼物。山本世界问你不用和女友过吗，佐藤大树回答我哪来的女友，山本世界又问你怎么知道我不用和女友过，佐藤大树说你哪来的女友。

    山本世界想不出什么想要的东西，或者说想要的东西大多太不切实际，所以又说“你还要给我买礼物？不攒钱吗？”

    “因为我也想要礼物嘛！”电话那头是这样说的。

    山本世界自认为算不上佐藤大树的亲友，以为自己在对方心里根本就排不上号，没想到会被寄予如此厚望。顺水推舟接着说下去，“那你想要什么礼物呢？”

    “我想要你教我跳舞！”电话那头好像是终于等到了想听的问题，连开心的情绪都顺着无线电波传递过来了。

    山本世界想，那有什么难的，于是只是问“你不学唱歌了吗？”

    “没说不学！”对方稍微顿了顿，“但是也想学跳舞！”

    “那圣诞节请我吃饭吧。”山本世界说。

    “学费这么贵吗？”

    “不是麦当劳就行。”

    “那就暂定萨莉亚吧！”

    不知道是开玩笑还是认真的，可挂断电话前他们两个都笑了。

    08

    虽然想到佐藤大树不可能安排什么上档次的地方，可圣诞节来到连锁烧鸟店的感觉还真是非常奇妙。山本世界的性格来说，避开这种日子外出吃饭才是上上策，不过他没想到的是竟然圣诞节的平价烧鸟也有不少人吃。进门时收银台后面刺眼的廉价装饰用假圣诞树，店里循环播放的圣诞歌单，节日气息带着刺鼻的人造气味，而山本世界只是在脑中计算圣诞树和存放它十一个月的成本，终究不知道是每年买划算还是买来放着划算。

    佐藤大树今天打乖乖牌，山本世界点了梨子沙瓦的时候，他点上了无酒精的汽水，于是面前的杯子上也写着大大的无酒精。山本世界没有客气过，鸡翅要两种味道鸡腿也要两种味道，还有鸡胗和鸡心，什么都能吃下去。

    佐藤大树的脸埋在手机里，好像一直在刷短视频，直到山本世界叫他才抬起头，问山本世界是怎么了。山本世界说你不点就没有东西吃了，佐藤大树才开始在平板上操作点了吃的又点了下单。

    感觉还是太奇怪了。在特别的日子和不那么亲近的人，吃一顿不典型的饭。山本世界不硬找话题，也不觉得有什么好聊。但只要佐藤大树放下手机，他们总还是有话聊。佐藤大树问他有没有上大学，问他怎么到现在的舞室跳舞，又问什么时候开始跳舞。山本世界觉得他好像真的要了解自己。山本世界问他老家在哪里，什么时候来的东京，还有未来，未来想做什么，不是那种两个月后的未来，是那种两年后和二十年后的未来。

    佐藤大树在听到问题后又吃了一块鸡心，山本世界想说那不是他点的，却想到反正都是他付钱也无所谓。咀嚼了一会儿下咽，佐藤大树说“22岁，我给自己的期限是22岁，如果22岁不能用喜欢的事情养活自己的话，我会找一份像样的工作的”，他喝了一大口汽水，“虽然我想不出我能做什么像样的工作就是了。”

    山本世界点了点头，又不知道该怎么回答了。一定是因为梨子沙瓦太甜了，黏住了他的脑回路。

    09

    那顿饭后约了一次跳舞，也没约好多久，山本世界想多久他都可以奉陪。不过佐藤大树也确实年轻，跳一下午连衣服都湿透了，却还嚷嚷着自己什么也没学会让山本世界再教他一遍，一遍又一遍，直到太阳都落山了。本来只说趁着舞室放假新年前能约一次跳舞，两人发现对方都不打算跟着父母回老家，反倒有了牵强的见面理由，跳舞从一次变成了两次三次。虽然不太想承认，但佐藤大树确实跳得有点像模像样的了，练习骗不了人。

    “我给你拍个视频吧。”第三个天快要黑的夜晚，山本世界这么说着，佐藤大树也答应了。一个舞从头到尾拍了三遍，山本世界总还觉得有点不满意，总在不同部分有那么一点点偏差，反倒是佐藤大树说要发在社交媒体上炫耀。山本世界觉得主人公开心就好，大概截取一下也有的是精彩片段。

    相对应的，佐藤大树也说要给山本世界拍视频。山本世界想要拒绝，质疑他说你知道怎么拍才有魅力吗，佐藤大树的小嘴抹了蜜似的讲世界桑的舞姿怎么拍都有魅力呀。终究是敌不过佐藤大树的坚持。跳了一遍，佐藤大树说是很完美，山本世界拿过来看，才发现录在佐藤大树的手机里。他说再用我的手机录一遍吧，佐藤大树说我传给你不就行了。所以就算搞不懂佐藤大树的心思，也不再想提出要求了。

    不知不觉间身体和精神都很疲劳，只想向自己家里奔去。山本世界突然想起什么，问佐藤大树要不要去他家。佐藤大树笑了起来，在故意调暗了灯光的舞室里，当然是答应了下来。山本世界只是在想，他的眼睛还是和第一次见面时一样漂亮。

    10

    山本世界不想回老家，老家那儿却还是寄来了年货，宅配到家，没有山本世界拒绝的份。对老家来说不算什么的份量，放到平时不做饭的人家里是一年都吃不完的致死量。至于为什么会叫上佐藤大树，只是因为刚好和他在一起的人是佐藤大树而已，并没有什么特别的原因。当然也有坏处，那就是他明明可以料想到佐藤大树不会做饭，却还是邀请他回了家。于是出现了两个人面对着一袋大米、几棵卷心菜还有个小南瓜毫无头绪的场景。

    “我们做大阪烧吧？”沉默中佐藤大树先说出了这句话，“除此之外你家有别的什么材料吗？”行动派佐藤大树拿起了手机搜索了起来，过了半分钟后就读起了材料表，“面粉？鸡蛋？猪肉？小葱？高汤？盐？你家有哪些？”

    山本世界的大脑从暂停状态中缓缓恢复过来。家里有什么呢，山本世界说，“都买新的吧。”

    新年期间开着的店少，明明需要的东西也不复杂，要凑齐了也不容易。生鲜市场没开门，这家便利店没面粉但有鸡蛋和猪肉，买上后提着袋子沿着街往下走。下一家便利店竟然有大阪烧粉，佐藤大树翻过袋子来看，说连调味都省了，山本世界松了口气。高汤也有瓶装的，甚至能买到海苔粉。

    走回家时一人提着一袋东西算是公平。还是熟悉的路，山本世界觉得近，只有佐藤大树觉得远。

    “有点冷呢。”佐藤大树的话带着白色的气。

    山本世界想开口又不知道说什么，走了两步之后回答说，“是呢。”

    11

    做大阪烧比菜谱上写的一二三四五混乱得多。山本世界家至少还有刀，把卷心菜切成方片，大阪烧粉加鸡蛋和水搅匀了再混合在一起，除了粘稠的液体飞出来一点出不了什么错。家里是不可能有铁板的，把平底锅拿出来后，山本世界用不信任的眼神看着自己的锅子，放到流水下冲了下拿起来擦干才放到炉子上。倒下一点油，把混合物倒进锅里，用锅铲整整弄成圆形。转到中小火，次啦次啦的，刚才被安排搅拌而现在闲下来的佐藤大树凑到他身边看。

    “还要多久呢？”佐藤大树问山本世界，虽然他才是负责看食谱的人。山本世界回答说不知道。

    就算不知道煎到多熟，中小火把东西煎糊的可能性不算大，山本世界决定慢慢来。一直守着锅也挺无聊带，不过有佐藤大树一起守着好像就没那么无聊了，尽管佐藤大树做的事情就真的只是每过十五秒问一次“好了没好了没”。

    直到肉眼可见地看到粘稠的液体慢慢凝固起来，山本世界用锅铲铲起一点点，看到掀起的部分在他的标准里算得上金黄色，觉得是时候翻面了。山本世界可没有厨艺高超到可以颠锅把正在煎的东西翻过来，不过顺着锅把半熟的大阪烧转移到盘子上并不难。再往锅里倒一点油，用手试试温度大概是热了，再想把盘子倒扣到锅上给它翻面。

    倒扣没那么容易，转瞬之间本来完整的圆形碎成了好几份。失手的山本世界没什么反应，反倒是佐藤大树叫了起来。山本世界歪了歪头用锅铲尝试把几个部分拼回圆形，不过好像短短十几秒就已经熟到无法互相融合。就算表面上还大概看得出是一个圆，实际上已经不可能维持一个整体。

    “……怎么办呢？”佐藤大树问。

    “也不影响吃。”山本世界放弃继续拼回大阪烧的想法，停下手静静等待另一面也变成金黄色，“难道你想要拍照之类的？”

    佐藤大树头摇得像拨浪鼓。又过了半分钟，他说，“也对，吃起来没差。”

    所以最终出锅之后还是遵照对大阪烧的尊重淋上酱汁、挤好蛋黄酱，又撒上海苔粉。

    山本世界拿走一块吃下第一口，意外的其貌不扬但超出他本来预期。扬了扬眉毛想要自夸，眼神却落到了坐在对面正在吃第一口的佐藤大树身上，不知道他此刻在想什么。

    “诶！好好吃！比想象中要好吃！”

    原来他们在想一样的事。

    12

    新年假期眨眼间就结束了，舞室回归正常课表，山本世界也默默回到了原本的轨道上——上班下班，上课放课，一周七天一个轮回。

    原以为佐藤大树会对跳舞提起兴趣偶尔来舞室练舞，可结果他也就这么音讯全无了，仿佛新年假期间那些一起度过的时间微不足道。山本世界后知后觉发现自己对那个人有一丝期待，以为他会成为关系更近一些的……朋友。不过山本世界也没有幼稚到去怪他，或是在内心的小账本上扣掉他的分，只是多记上那么一个小插曲。

    再等到佐藤大树的联系又几乎是一个月后。毫无征兆地，佐藤大树发来消息问「这周有没有时间一起吃个饭？」

    比起佐藤大树的突然到访，提前发消息打招呼反倒让山本世界不习惯。为什么不像以前那样直接过来我家呢？为什么假期过后反而变得生疏了？为什么会有如此强烈的违和感呢？这些问题原本不该困扰他，但却在山本世界收到消息后纠缠着他一整天。他拖着回复消息这件事活动了整整一天，连跳舞的身体都变沉重了。

    怎么回呢？山本世界想不好，直到回到家打开冰可乐，还是觉得这件事不得不做。

    「我都没事的，时间和日期都你来定吧。」

    于是就这样最低限度地进行了回复。

    13

    直到抵达约好的地方山本世界才发现这是一家正经的大众平价居酒屋，而直到佐藤大树点了生啤还堂堂正正把证件给店员看，山本世界才发现他突然之间已经成年了。

    “……生日快乐？”山本世界开始在脑海中回放第一次见面的场景和当时说过的话，后知后觉地意识到当时说的三个月已经到了。佐藤大树随口回他说谢谢。山本世界说都没有给你准备礼物，佐藤大树说不用客气。

    对话停了下来。两个人都沉默着翻着手上的菜单，明明就一页纸，山本世界正反翻了好几次确认，最后点的东西也就是最普通的毛豆炸鸡厚蛋烧，但不知道说什么，看菜单才是安全牌。

    “今天也在舞室？”佐藤大树的问题干巴巴的，山本世界点了点头，他也难得去什么别的地方。吵闹的餐厅里，这两平米空间里又沉默了下来。

    山本世界觉得一个月时间不长不短，不足以发生什么不得了的大事，只能问些不痛不痒的问题。问生日好像显得错过的自己更加尴尬，小心翼翼绕开后选择了“你怎么不来舞室了？有空来上我的课”，稍微顿了下，“友情价，不收你学费。”

    佐藤大树的嘴角微微上扬了一丝，“最近打工太忙了，有机会一定。”

    下酒菜陆陆续续上桌了，两人不再费心找话题，开始称赞小吃口味合适，上菜所需时间也不长，位置宽敞，是个不错的下班后小聚去处。菜吃完了，好像又没话聊了。山本世界本就不是会没话找话的类型，安静的空气没有让他感到过于不安。

    等服务员麻利地收掉桌上的盘子，佐藤大树举起酒杯猛喝了一口，把空杯放到桌上，吸了口气，像是要说什么重要的事情一样，连山本世界都跟着屏住了呼吸。

    他开口的时候说：“你想去美国吗？”

    “什么？”

    14

    山本世界猛喝了一口面前的生啤，才想起自己不太能喝酒的，更不要说猛地一口，刚才续杯的时候就该叫可乐了。可喝下去的啤酒又不能吐出来，明明应该已经到胃里了，却感觉泡沫还顶在嗓子口让他说不出话来。虽然没有和佐藤大树对视，山本世界却能感受到佐藤大树的目光焊在自己身上。此刻，他最不想做的事情就是抬头和佐藤大山对视，于是又用筷子夹起毛豆往嘴里塞。

    “前几天不是我生日来着，那时候我把给你拍的视频剪的短视频拿给朋友的朋友看了……”佐藤大树越说好像越没有底气，“然后那个人就说啊，他有认识美国那边舞团的人，如果你想过去进修也好加入也好，都是可以的哦？”佐藤大树咽了口口水，好像很难开口，“你也知道的吧？在这里呆着……很浪费的哦？你明明跳得那么好，想去哪里跳舞都可以去的。”

    胸口有点闷闷的，山本世界抿了一口啤酒，觉得不解气，招手叫来人说要可乐，还是没看佐藤大树一眼。夹起炸鸡嚼了两口，咽下去的时候觉得粘着喉咙，总想喝点什么，直到可乐上了桌，喝下一大口，才觉得舒服一点。

    “如果我就是想呆在这里呢？”山本世界没有抬头，把问题抛了回去。

    “怎么可能呢？”佐藤大树的声音里有一丝惊讶，“怎么会有人不想去美国呢？”顿了顿好像在揣测山本世界这样说的原因，“如果你去的话他们给的条件应该不会比你现在的条件差，试试……”

    “关键是我想不想不是吗？”山本世界抬起头终于和佐藤大树四目相对，“我不想。”看着佐藤大树有些不解的眼神，山本世界又重复了一遍，“我不想。”

    向来像是有说不完话的佐藤大树沉默着撇开了眼神。过了感觉好像很久的一会儿之后，他轻轻说了句“知道了”。

    15

    山本世界知道自己这事儿做得不体面，不论是听到提案当下的那股无名的火驱使他没留一点面子当面拒绝，还是丢下应该足够支付账单的钱就直接从饭店离开，都算不上体面。或许山本世界算是逃走，但他不想承认。

    很想静下心来做点别的什么事情，脑中却还是回放在居酒屋的场景，一遍又一遍。山本世界问自己有没有生气，为什么生气，好像没有道理，但却逐渐清晰地感觉到是有原因的。因为佐藤大树明明是那个有求于他的人，佐藤大树明明是那个年龄更小的人，佐藤大树明明是那个经历更少的人——他凭什么觉得他知道什么更好呢？他有什么资格呢为别人选择出路？山本世界发现原来觉得自己被小瞧了被否定了，而他刚才的表现就像是一个固执己见的人，他可能真的是一个固执己见的人。

    山本世界又一次告诉自己，他选的路没有错。山本世界再一次尝试说服自己，现在的舞室就是自己最想要呆的地方，有朋友，有工作，能跳舞，什么都不缺。他决定当作自己想通了，又拿起手柄打开游戏打算继续玩下去。

    剧情恰好来到一片废墟之中，断壁残垣阻挡山本世界的道路。本来找路就够麻烦的了，好巧不巧又在存档点前被不知哪里来的生物袭击，又回到了打开游戏时所在的地方。虽然花的时间算不上太长，重新找路也不算太难，可山本世界摔掉了手柄，不想再重新开始一次。

    操，山本世界看着天花板，听着游戏暂停却不停止的音乐，想着，自己这么烦躁，或许因为佐藤大树是对的。

    16

    像在赌气，佐藤大树不联系他，山本世界也不想主动联系。虽然理智上觉得自己多少是想维持这段关系的，也应该付诸行动，可精神上的准备却迟迟完成不了。该上的班还在每天继续，稍微走神也不会被谁发现，只是回到家又恍惚觉得家里有些冷清，明明住在这里的好几年也一直是这样过来的。

    一直难受到了周五晚上，山本世界已经打开过三千次两人之间的对话框，内容也输入删除了好多次。他平时不是随便找话的人，总不能用天气真好开头，但道歉显得太严重，提跳舞的事又太公事公办，甚至山本世界有一瞬间想让家里再寄一箱书才来让自己找个话题，不过最后还输下定决心发送了一条「今晚来我家喝酒吗？」

    佐藤大树一如既往地很快回复。「好啊。」又传来一条补充「我这摊喝完就过去。」

    山本世界问的时候不多想，等这时候才想起来家里几乎没有酒精饮品，打开冰箱看到一罐孤零零的麒麟一番榨，怎么也不够两个人喝。想着大概佐藤大树过来前还有时间，匆忙下了楼，到了地面才觉得没必要走那么快。吸了口冷风脑子冷静了一些，放慢了脚步。在脑中确定自己要去哪家店，随即身体就能确定要去往的方向。买了一提啤酒和一点点零食，付钱，原路返回。回去的路永远比来时的路要短，山本世界用鼻子轻轻哼起了不知道在哪里听到的曲子，直到走回到楼下才发现口袋里并没有家的钥匙。脚步停不下来，回到家门口，没有此刻比这时候更恨这是一扇会自动上锁的门。把啤酒和零食放在家门口，从口袋里掏出手机打电话给房东，道歉好几次也觉得不够，听到房东说“这摊喝完再来，你要多等一下”就觉得更内疚，打扰了别人本应更美好的周五。

    挂了电话坐在走道。不想浪费手机的电，可等待的每一分钟都特别长。山本世界数视野范围里能看到的大楼，数完大楼数每一栋楼上有多少灯，站起来数这条街上的树，然后盯着路过的每一个人的头顶，想着不知道会不会有人抬起头看一眼，直到熟悉的头顶映入眼帘。

    “你怎么在这？”佐藤大树爬上楼梯，被靠在走道上的山本世界吓了一跳。

    “喝吧。”山本世界把啤酒拆开递给了他。

    17

    佐藤大树接过啤酒打开，问山本世界怎么不进去，山本世界老实回答说没带钥匙。佐藤大树问怎么门外会有酒，山本世界指了指装着零食的便利店袋子，觉得能回答他的问题。佐藤大树看了背后的门边上的名牌上写着山本，确信自己不会被当成什么可疑人物，靠着门蹲下了。山本世界把零食袋子放到他身边，说了句看看你吃哪个，等到佐藤大树翻找起来，才又说房东等下过来送钥匙的事情。

    关键的事情依旧说不出口，山本世界低头看佐藤大树叹了口气，却突然觉得和初次相遇那天好像，缩在墙边的人类，纤细都手腕，好像什么都没变似的。

    “你为什么喜欢大海呢？”山本世界脱口而出。

    “明明大家都喜欢大海的吧？”佐藤大树喝了口啤酒又吃了口花生，“夏天就会想要去海边玩，阳光也好、沙滩也好”，佐藤大树停顿了一下，“谁不喜欢美好的回忆呢？谁不想拥有更多美好的回忆呢？”

    “这样的话问更喜欢海边还是更喜欢山里不就好了吗？”

    “那不就完全让人联想到出去玩了嘛。”佐藤大树撇了撇嘴。

    山本世界被说服了，“但实际上也没有人‘不喜欢’大海吧？”

    “优先级很重要！优先级！”佐藤大树突然提高音量嚷嚷着，“不过你不明白的吧？我小时候住的地方离海好远”，声音又小了下去，“明明知道要坐好久好久的电车，心却还总是怦怦直跳……不管换几次车，到海边的时候，总觉得很值得。”佐藤大树停顿了一下，“大概是看见了平时看不见的画面，听到了平时听不见的声音。”

    山本世界并不觉得大海是这么神奇的东西，也或许是因为他本来住的就离海算不上远，大海就在触手可及的地方。他记忆中的海岸线上被开发成适合游玩的地方其实少得可怜，大多未经开发的滩涂并没有什么令人印象深刻的可爱之处，只是存在于海边罢了。要选暑假去哪里玩，山本世界在小时候也不是非得去海边不可的孩子，他觉得山里也很好，说不上更喜欢哪个。

    “嘛，不过海边确实也挺有趣的。”山本世界看到房东的身影在楼梯转角处出现，匆匆结束了这个话题。

    18

    对房东即时出现帮忙开门三番五次道谢，还把佐藤大树这位朋友介绍给了房东认识。房东不是什么老顽固，应付过去算是容易，相比之下佐藤大树更难应付一些。

    “你呢，为什么更喜欢天空呢？”佐藤大树把问题抛回给山本世界，“或者说那时候为什么会回答更喜欢天空呢？”

    “这个嘛……”山本世界不好意思说自己从来都是喜欢天空的，明明不是敷衍却听起来像敷衍，“不过话说回来，我叫你过来是想请你帮个忙……”

    “哦？什么事？”

    山本世界深深吸了一口气，再用嘴巴吐出来，平复不了自己加速的心跳，但他决定要说了，“关于上次美国的事情……”

    “什么嘛，要我帮你联系吗？可以啊。”

    这么简单？山本世界在心里想，但接着就继续问佐藤大树详细情况。佐藤大树说你过来坐下喝点吧，别坐立不安的那个样子了，还以为你要说什么大事呢，结果就这点事啊。山本世界觉得自己没表现的那么明显，可连佐藤大树都看出来了，大概是真的很明显吧。他的心跳熄了火，乖乖遵照佐藤大树说的拿出啤酒在桌边坐下。又为上次的回应感到尴尬，山本世界轻声道歉了，佐藤大树说没事没事，接受你的道歉。于是对话进入详细聊聊是怎么回事，为什么会有这个机会，具体的条件是怎么样，也打探打探对方究竟想从山本世界身上得到什么。

    “不论最后如何都要谢谢你……”山本世界说。他总觉得自己有什么没说完的话，但此时此刻他不知道自己该说些什么，也不知道自己想说些什么，于是句尾停在了这里，不干净不利索，但山本世界不打算继续说了。

    佐藤大树看了山本世界一眼，发现他没有要继续说了，才慢慢开口，“我说过要报恩的啊。”

    19

    事情一旦开始推进就比想象中简单得多也快得多，竟然几通电话几封邮件就能安排一次参观旅程，也只要一次参观就能让山本世界下定决心未来一段时间要在海的另一头度过。山本世界想不起来上次一下认识那么多新的人是什么时候的事情了，虽然也没记住多少名字，但竟然感觉不差，好像和每个人都还算能聊得来。其实更让山本世界惊讶的是，佐藤大树好像比他自己更了解他，好像应了那句旁观者清。

    开始收拾才发现，山本世界的小房间里根本没多少东西。借口作为迟到的生日礼物，把游戏机交给了佐藤大树，被佐藤大树说理由太脱线，又改口说是感谢牵线的礼物。衣服之类的整理出一箱子必需的，剩下的丢去了回收站。漫画之类可有可无的东西分别一件两件送给朋友，顺便也和老友叙叙旧，再简单交代自己要去哪里。这样忙忙碌碌一转眼就到了四月，这样新的一年就真的开始了。

    佐藤大树没送山本世界去机场，也没再为了告别吃一顿饭或者喝一顿酒。山本世界在出发前夜发消息问佐藤大树有没有什么想要的东西，佐藤大树回消息呛他说怎么现在才问，山本世界说我也总要回来的，十个小时飞机而已。打完字才觉得好远好久，虽然本来也不是常见面的关系，可想见面的时候不出半小时就能见到，而以后他们之间竟然是要在空中飞十小时的物理距离。佐藤大树过了一会儿回他说那等你要回来的时候再问我吧，山本世界回了个写着「OK」的表情，却还是没法好好把谢谢和再见说出口。说得太重就好像再也见不到了似的，可不说又觉得少了些什么，明明清楚佐藤大树不会在意，但依旧想说，可也依旧难以说出口。

    最后留到起飞前开启飞行模式前的最后一刻，山本世界打完「要起飞啦，下次再见喔」点击发送后不给一丝回信的时间就迅速打开飞行模式。

    「你回来的时候一定要告诉我喔」「我就想要这样而已」——十小时后山本世界看到了这样的回复。

    20

    山本世界不是第一次穿过美国海关也不是第一次走在洛杉矶街头，但他是第一次度过没有戴口罩也不需要吃鼻炎药的四月。五月开始就不怎么下雨了，山本世界逐渐在日本人聚集的地方找到几家符合口味的餐厅，却不怎么习惯越热越干的天气。想象中的洛杉矶和东京一样，夏天的呼吸中应该带着湿热的水汽，可就像东京没有高挑的棕榈树一样，洛杉矶的夏天里也不带一丝的水分。

    闲聊的时候被人推荐去海边看看，山本世界才想起来自己过来几个月了还没去过最为出名的旅游胜地。同事添油加醋地说夏天的海边是最好的，山本世界不算太相信，却还是在有闲的时候决定去看看。明明挑了个不该太繁忙的时候，可圣莫尼卡的海岸线上从来都不缺人，在八月盛夏更是挤满了各种各样的人。山本世界向来不够喜欢人群，也不够喜欢沙滩和海岸线，从停车场上来就看到有人在和路牌合影，山本世界想不知道这合影要发到什么地方去。

    不下去沙滩就不会有沙子进到鞋里。双手插在口袋里轻轻松松地沿着海岸往人更少的地方走过去，竟然觉得沙滩竟然看不到头。总也没有看不到人的地方，但有能坐下的地方。山本世界朝着海坐了下来，看到海鸥飞过去，赶紧拿出手机来拍照。只是来不及拍到海鸥，也没有棕榈树，没有日落，也没有摩天轮。山本世界点开刚拍下的照片，抬起头看了看眼前的景色，又觉得这里本来就是这个样子的，于是点开聊天框把照片传给了佐藤大树，随着照片一同发送的消息是「你喜欢的海」。

    看到消息边上显示了已发送，才开始计算起日本现在几点。好像是七点多，大概暂时等不到回复了。山本世界决定再坐一会儿，看看海鸥。路人和山本世界打招呼，山本世界也和他闲聊两句。直到空气中出现要日落的气味，山本世界开始往回走。离停车场越近人越多，总觉得比刚才来时的人更多了，大概是为了看日落而到来的游客已经来了。人太多了，山本世界有点想逃跑，却在这时候收到了佐藤大树的回复。

    「我好像开始明白你为什么喜欢天空了。」

    接着他又发了一条，「大海也没什么特别的。」

    山本世界停下了脚步，查了查日落时间，就快要到了。眼前的人潮比此刻的海还要汹涌，山本世界望向那大海，却愈发清晰地感受到喜欢海才理所当然。

    山本世界决定了，他要留下来看日落。

    END.
