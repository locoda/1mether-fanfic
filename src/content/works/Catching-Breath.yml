- title: Inhale
  body: |
    March

    Ilya is distracted, and everyone in the arena knows why.

    Shane was knocked out of the game on what should have been a routine hit, two days before Ilya left for the road trip. The media has been unusually quiet about the injury. Shane has not said a word on social media. He is not a heavy poster to begin with, but as time goes by, the silence starts to feel loud.

    It is the fourth and the last game of the road trip. Ilya can fly back to Ottawa as soon as he gets out of this arena. But right now, midway through the third period, he has no choice but to stay on the ice and line up for the face-off. The arena was packed, the audience cheering the opponent team’s name all around, though it all felt distant to Ilya. Inhale for 4, hold for 4, exhale for 4. He tries his best to regulate his nervous system.

    “Hey,” the other center says. “Hope Hollander’s okay.”

    Ilya blinks. He forgets his count. He loses the face-off.

    It is not the longest period he has ever played, but it feels endless. He intercepts a pass and pushes toward the neutral zone, only to catch his edge and trip. He goes down hard. When he gets up, his nose is not bleeding. He returns to the bench. When coach Wiebe looks at him with concern, Ilya shakes his head and says “I’m fine.” He doesn’t look the coach back in the eye.

    There is still too much time left on the clock.

    He wants to check his phone. Shane is still recovering. No screens. No messages. And even if there were, Ilya is not supposed to check during a game. None of that stops the urge. Shift after shift. He does what is asked of him.

    When the final horn finally blows, they win by one. It is a messy, exhausting victory. Ilya heads straight for the locker room. He pulls out his phone before he has even finished untying his skates.

    There is a message waiting.

    "Come home safe." It’s from Yuna.

    Shane feels like hell.

    It wasn’t his hardest hit, so logically it shouldn’t be his worst concussion. Still, this is the one making him suffer. Over ten days have passed, and he remains extremely sensitive to light and sound. Even a thread of light through the curtain gap or the sound of opening his door can instantly overwhelm him, as if his head is being cut through. He can’t even talk or walk like a normal person. This is worse than the concussion he had last year, and he doesn’t know how much worse it’s going to get, or how many more days he’ll be trapped in the dark.

    The only thing in his mind is that Ilya is coming back tonight. To be honest, he has no idea what time it is, or how far away “tonight” actually is. The room had become a timeless box of darkness where all hours felt identical. Ever since Yuna walked in with a few steps that almost destroyed his head and told him that Ilya will be back soon, the thought has occupied his mind so completely that he falls asleep without the usual strange dreams.

    When he wakes up, he finds Ilya’s head resting on his stomach. One of Shane’s hands is held tightly in Ilya’s. It is larger and warmer, as if he is never going to let go. Ilya doesn’t smell like the shampoo in their house or his parents' house. He must have come straight to the bed from the arena, even though the arena is a five-hour flight away.

    “Hi,” Shane says when Ilya’s head moves slightly. He attempts to force a real smile onto his face.

    “Hi, sweetheart,” Ilya mumbles, not quite awake. “I’m back.”

    A long silence settles between them. After five years of marriage and being teammates, they’ve spent enough time together that they aren't in a hurry to talk or to have sex. Shane feels more comfortable than he used to just letting the silence embrace him. There’s nothing he needs to say right now. He just enjoys the weight of Ilya’s hand.

    Ilya inhales sharply, seemingly collecting his words, but he just says, “I missed you.”

    “It’s been like a zillion years for me in this room,” Shane says. “I missed you so much. Did you win tonight?”

    Ilya grins. “Bad news for you. We won without you. Perhaps you’re not necessary for the team anymore.”

    “Fuck off, Ilya. I’m the first-line center.”

    “Not right now, man.”

    Shane rolls his eyes until it hurts. “You’re such an asshole.”

    Ilya gets a bad feeling when the team physician pats Shane’s hand gently and tells him it’s just a matter of waiting and observing for a few more days. He tells a small lie about his back hurting from the air mattress. It is not entirely a lie; his lower back actually aches, but not enough to need help. He follows the physician into the living room, and Yuna follows almost immediately. Ilya knows Yuna. He feels worse now.

    “He is not going back to the ice soon, right?” Yuna’s frankness is sometimes scary.

    “I would say we need more time, but… probably, yes.”

    “Not in a short time, or…” Yuna stops, the unspoken question hanging in the air. A cold certainty settles in Ilya’s mind. He was terrified of the answer.

    “If he were still 25, I would be more positive,” the physician shrugs. “He’s 35 now. He can recover from this one.” He shakes his head slightly. “But he might not stand the next one. You need to think about the future.”

    Ilya is not the one who usually thinks about the future. That was never his responsibility in this relationship. Fortunately, or perhaps unfortunately, Yuna thinks enough for both of them; she responds with an assertive nod. “I get what you’re saying. Thank you for letting us know.” She sounds official. Ilya looks at her rigid back and hears the unnatural steadiness in her voice. It is too official.

    He isn’t sure how he feels yet. His mind just goes … empty. He feels as though he’s been thrown into a vacuum with no sound, no scent and nothing to react to. He doesn’t remember saying goodbye to the physician or how long he stood frozen.

    “Dinner is ready!”

    David’s voice breaks through the void. He inhales heavily, realizing he has been holding it, and then air comes into his body. Yuna is gently patting his back and pulls him into a warm hug. Senses return to his body, as if he had forgotten he was alive until this very moment.

    “Let’s have this dinner together first,” she says.

    Ilya nods to her, then nods to himself. But he senses a heavy weight settling into his future.
- title: Hold
  body: |
    July

    Even though Canadians do not fear the winter, Shane still loves the summer more. It is not the same as holding the Stanley Cup. Nothing is. But skating on summer ice feels different. It is lighter. It is more free.

    Shane is ready for the summer hockey camp as usual, and he has decided to enjoy it as much as he can. Right now, he is watching Ilya get into his gear. This afternoon, they have a game with the kids. It is the part Ilya silently loves the most.

    “You sure you don’t want to get on the ice?” Ilya notices his gaze. He always does. He looks back at Shane.

    Shane shakes his head slightly. “I cannot.”

    “Kids cannot hit you that hard,” Ilya shrugs. “And we are not going to hit you. We know your condition.”

    Shane pauses for only a fraction of a second. “Hm. You really want to beat me that bad? Do you miss when we were on different teams?”

    “Mm.” Ilya doesn’t seem to buy it. He finishes putting on his gear and moves closer to Shane. “I mean, it’s up to you.”

    Shane swallows hard. He was on the ice by himself yesterday. He had rejected Ilya’s proposal to warm up together and told Ilya he was worried about getting hit by his strong body. It had pissed Ilya off.

    If he were honest with himself, he simply cannot skate or handle the puck like before. It is not even close to his form before recovering from his last concussion. He hasn’t skipped his recovery exercises after he feels better. He has done cycling and the ground training. But the ice feels like a stranger. The thirty-year relationship he had with the game now means nothing. He cannot hide this much longer. The team physician and Ilya will find out soon. Shane has made up his mind to give himself a few more weeks until the end of summer camp. He will tell them the truth if the feeling doesn't return. It has been months since the hit, and Ilya is very perceptive. Maybe he already knows the truth.

    Right now, Ilya is almost covering him with his body. He stops Shane’s train of thought by leaning over. “What are you thinking?”

    Shane tips up his heels and kisses Ilya with tenderness. He really hopes he can get back on the ice in the next few weeks. He wants to skate by Ilya’s side for a few more years, just like they have for the last few years.

    Ilya is sure that Shane is hiding something. It is probably about recovery. Ilya knows it could be bad, but he has no idea how bad. Is it enough to make Shane stop practicing with him just to hide the truth? Ilya has been the full-time asshole in the past years, but he still has no clue how to start this conversation. He lacks the confidence to break the silence.

    Beyond that, it is hard to focus on the game when your husband is sitting beautifully on the bench.

    Ilya passes smoothly through a boy who feels only a half of his height. He casts a shot toward the net. He is checking on Shane during the release, and that is his excuse for missing. He half-pretends to be mad. He throws his stick against the post to look annoyed.

    "Behave, Ilya! You’re an adult!” Scott Hunter shouts. He is gladly leading the other team of kids.

    “You’re actually a hundred thousand years old, aren’t you?” Ilya shouts back. He realizes too late that his stick is broken. He didn't control the angle or the force. He skates toward the bench, still talking to Scott. “Actually, you must be a hundred thousand and ten years old.”

    “F—” Scott stops himself. He remembers he is surrounded by the future of hockey. “Fine.”

    Ilya sticks his tongue out at him. He stops at the bench, ready to head to the locker room for a spare stick.

    “Use this one.” Shane blocks his path by handing over a stick. As he takes it, their fingers brush, a familiar spark of contact.

    “Huh. Why?” Ilya is confused. He takes the stick. It isn't his. It’s Shane’s.

    “Too nice of a stick to stay on the bench.” Shane shoots him a wink. It is the most beautiful smile Ilya has seen in months, which is enough to make Ilya stop thinking about the feasibility of using a curve he has almost never touched.

    Not scoring a single goal in the next period is only slightly Ilya's fault. It is mostly the stick. Shane is gesturing wildly from the bench, giving directions with his hands. Ilya cannot use the tool as well as its owner.

    “Stop cheating, you sweet little couple!” Scott shouts from across the ice.

    Ilya takes a heavy breath. He holds it. He counts down from three in his head. Then he pushes all the air out of his lungs. He refocuses on the game. He cannot stop smiling.

    It has been a long day. It has been two long weeks. Ilya finally drags Shane onto the ice after everyone else has left the summer camp. Shane had stayed away from the ice throughout the camp. There were enough coaches so it wasn't an issue for the camp, but both of them knew this wasn't about the camp schedule.

    It takes Shane a long time to put on his skates. Ilya promised they were just going to skate around, so no gear was necessary. Still, Shane feels awkward that his skating will give out his condition. It isn't that Ilya will judge him. He just feels unprepared.

    Ilya is already out there. He looks effortless even though he has spent the past two weeks on the ice. He isn't wearing pads either. His curls tremble against the wind he creates from skating fast. He closes his eyes and enjoys the movement. This is what normal looks like for someone who has skated since he was three.

    Shane takes in the cold air and forces himself onto the ice. He has his balance, but it is fragile. When he starts to move, he has to gather all his attention to stay in his shape. He has no bandwidth left for his facial expressions or his body language. He knows he isn't skating elegantly. He has no choice. A single distraction could make him trip on this stupid ice.

    Ilya approaches him smoothly. “Why are you so slow?”

    “I’m just too tired,” Shane claims loudly. He realizes too late that Ilya was talking about the time he took to change, not his skating.

    Ilya snorts. “You didn't even get on the ice for two weeks. How tired can you be?”

    “I’ve been practicing observing everyone as an outsider,” Shane says. “Providing a different perspective. It’s called management.”

    Ilya reaches out. Shane obediently puts his hands into Ilya’s. Ilya starts skating. He moves steadily, and Shane lets himself rely on that strength. He gives up some of his weight to Ilya. It feels like learning to skate for the first time. It is easier to balance with some help. Shane closes his eyes and sinks into the familiar sensations he has missed for months.

    Ilya stops gently. Shane stops beside him. They are close. Ilya pulls him in until his breath is warm on Shane’s face.

    “Hey,” Ilya says.

    “Hey,” Shane smiles back. He expects a kiss. His eyes are half-shut.

    Ilya doesn't move. Shane opens his eyes, a doubt rising in his gaze. Ilya hesitates for a second before he speaks again. “You don’t have to skate if you don’t want to.”

    Shane frowns. “I actually want to.”

    “I mean, maybe the condition doesn’t allow it,” Ilya shrugs. “You know your body better than anyone.”

    “It’s getting better.” Shane hates where this is going.

    “Yes. Of course. I trust you on that. I’m just worried.”

    “It is better.” Shane hates how defensive he sounds. But if he doesn't push back now, he might never get back to where he was.

    “Listen. I am not rushing you,” Ilya says, his voice full of concern. “I know this sport as well as you do. You can recover this time. But what about the next hit? Are you willing to stay in bed for–”

    “I am not going to be like that!” Shane cuts him off.

    “It’s likely, Shane. It is almost a certainty that you’ll get hurt again next time.”

    Shane shakes his head. He has no words to defend himself. Not with the way his head still is not fully functioning like right now.

    “Look. We can retire together. Now. We could have another dog. Maybe a kid. Or two. We can still hold hockey camps or play community games. You just wouldn't be an NHL player. It is not a big deal. We will be in the hall of frame after 3 years. Together.”

    It is a beautiful image. But at this moment, it feels like a trap. Shane’s fury takes over the control. “You really want me to retire that much? You’re offering to quit just to get me to stop? Sorry, I am a grown-up who can make my own decisions."

    “You know that’s not what I meant.”

    “I don’t know!” Shane blurts out. He sees the hurt on Ilya’s face immediately. He regrets it, but the words are out. “No, I mean. I know. I just…”

    Ilya lets go of his hands. Shane tries to chase, but Ilya is already moving toward the exit. He steps off the ice and turns back, his eyes dark and sad.

    “Shane, we should cool down a bit. You stay here tonight. I’ll go home.”

    Shane can only nod.
- title: Release
  body: |
    August

    Shane has been avoiding their house for almost a month. He went to the cottage the day after their conversation on the ice. He stayed there. He practiced on the ice every day. He did his yoga. He watched endless television. Admittedly, it is the saddest stay he has had in ten years.

    It is not that he and Ilya aren't talking. They send morning and night greetings. They share calendar items or errands. But Ilya never asks Shane to come back. Shane never proposes it. It doesn't feel like a war. It feels like a heavy silence neither of them knows how to break. The elephant in the room has grown too large to ignore.

    Today is especially hard for him because it’s the first day of the training camp. He was examined by the team physician at the arena a few days ago and determined that he is not recovered to the state that he can participate in the camp, and unfortunately, he is very sure that judgement is fair to his conditions. Ilya texted him to say he will be joining the camp yesterday, so Shane replied that he could not join. Ilya was typing a bit and stopped, then Shane saw he sent over “I am sorry.” Shane didn’t know what he was sorry for, and he felt too heavy to respond, so he let the words sit there.

    The weight carried over into the next morning, and he decided to just rest a bit today. He has been on this top trending TV show for over four hours before he finds out there are text messages from Troy on his phone, telling him that Ilya sprained his ankle in the training session and headed back earlier than expected.

    “It's mild. Nothing too bad. I guess he’ll be fine in a week or so. ” It's supposed not to be a big deal. It happens all the time in training or in the game, possibly the most common problem a player can have in ice hockey. Maybe Ilya just forgot how to warm up or had tripped on ice, and the team physician must have examined carefully and given him the right treatment. There should be nothing to worry about, but Shane's brain is suddenly occupied by the single fact that Ilya’s ankle is hurt, he just cannot stop it.

    20 minutes. Shane orders himself to calm down temporarily. If Ilya does not send any message in 20 minutes, Shane would leave this cottage and go back home.

    Ilya is lying on the couch with an ice pack on his ankle, surprised by the noise of the front door. He doesn’t have to ask who it is because there is only one rude person who would open their front door without knocking.

    “How is your ankle?” That person moves with some urgency and stops a few feet away from the couch, sounding concerned.

    “Not bad.” Ilya stays in his lying position comfortably, not even turning towards the source of the voice,“You should text.”

    Shane moves closer. “I mean, this is also my house.” He walks around the couch and sits at the end. He takes Ilya’s foot in his hands and strokes it gently. Ilya tries to pull away, but Shane holds on.

    “So what brought you here?”

    “Your ankle.”

    “Bullshit.”

    “You know I can worry too much under the circumstances, like I am worrying about you right now.” Shane says anxiously. “It is probably irrational and I am not going to lie.”

    “Mm. You can see. No big deal. Are you ready to head back?” Ilya sits up and stares at Shane.

    “Why are you always such an asshole to me?”

    Ilya leans forward, “Because I tried to be good and it didn’t work out.” Shane can tell from his eyes that he is not angry right now, nor sad. It’s just a part of his strategy to be an asshole, and Shane can definitely work with it. Ilya continues, “Also, I am a bit pissed off that you could actually stay away for a month. I guess we are no longer young.”

    “Not like I enjoyed it.” Shane shrugs. He starts to regret it now, as he should have come back a little bit earlier, which could have made things a little bit easier. “I am sorry that I was so self-absorbed. You have every right to feel worried about my condition and my future. Like I am worrying about your ankle right now.”

    “Your concussion is much worse than this stupid ankle.” Ilya reminds him.

    “I know. I know it has been almost half a year and I am not recovering the way I expected.” Shane lowers his head. “I just need a little more time.”

    Ilya puts his arms around Shane, “You know I can wait.”

    Shane stays in the hug until it shifts into a kiss. He remembers the taste of Ilya and feels the tension finally draining away his body.

    Shane is not in the living room when Ilya comes back from the arena. His ankle is fine; the team physician told him he can be back on the ice for practice in a few days, and he will be ready for the opener for sure. The problem now is whether he wants to go back or not. Ilya forced himself through the first day of training camp, but now he has someone to talk to, about his future and about their future.

    Ilya searches the house. Not in the bedroom. Not in the fitness room. Not in the trophy room either. He checks his phone again to make sure he didn’t miss any messages Shane might have left, then realizes there’s one more place he should check.

    Their mini-rink for practice was remodeled last year. Shane is sitting on the bench, taping his stick carefully. Ilya walks over and sits by his side. “Are you going on the ice today?”

    Shane shakes his head. “No.”

    “Then why?”

    Shane stays silent for a minute, continuing to finish taping the stick in his hand. Ilya looks at him patiently, not moving. Shane is taping slowly, overlapping the tape in perfect layers. Ilya waits until the last bit of the stick butt is covered, until Shane cuts the tape, and until Shane takes the stick and flexes it to test the grip. Shane hands him the stick. Ilya looks back at him in confusion.

    Shane inhales. “I am retiring.”

    “Wait. Then I—”

    “You should continue to play.” Shane pushes the stick towards Ilya, “Take this with you.”

    “Why?” Ilya blurts out, “How? How can I play without you? Do you finally somehow find out a way to torture me?”

    “I know you can. You know you can. The hockey world deserves you.”

    “You also need me!”

    Shane smiles widely, but Ilya feels like he can see tiny tears in his eyes. “You can definitely play five more years, even though you eat like a teenager. Don’t make me jealous.”

    Ilya knows that Shane is right about it. He sighs and takes the stick. “What about this?”

    Shane blinks. “You can take me to the rink.”

    Oh, that’s it. Ilya thought Shane would refuse to retire and keep himself on the injury list for two more years before committing to it then. Ilya would have totally accepted that. He didn't imagine Shane would come up with such a brilliant and creative way to stay on the ice. Ilya has to admit, he likes this idea. He nods, a genuine, easy smile returning to his face.

    “I promise to.”

    Shane feels like he has a lot of words he wants to say right now, but none of them come to him easily. He is grateful that Ilya waited for him, not only this time but every time. He loves that Ilya is always by his side and is going to carry his legacy in the future. He could say those words out loud, but it would never match the degree of what he feels in his heart.

    Ilya changes into his skates quickly and takes off onto the ice, carrying the stick Shane just taped. “I wanted to say last time, I believe your stick is the reason why you have a weak backhand.”

    “Fuck off. Be careful with your ankle before you talk shit.”

    “I am not that fragile. Team physician greenlights me to skate casually.”

    “Okay then. Good luck perfecting my techniques.”

    Ilya snorts. “Wow. Sounds hard.”

    Shane’s eyes follow him instinctively. He thinks no one in the hockey world skates better than Ilya, maybe except himself. But that is over now. When Ilya turns back to face Shane, a cocky smile expands on his face. “You see? I can handle this very well.”

    Shane remembers the summer before his rookie season, and even before that, the first time he saw this smile on Ilya’s face.

    There are things that have never changed since then.

