title: 使用说明
updated: 2026-11-01
summary: 不会写代码也能搭一个自己的同人文网站。从建站、写文到批量导入和备份，一章讲一件事。
status: finished
chapters:
  - title: 这是什么
    body: |
      <aside class="author-note" aria-label="作者注">

      这篇是模板自带的使用说明，和另外三篇示例作品一样，开始写自己的作品前在后台删掉就好。

      完整、最新的说明在模板的 [README](https://github.com/locoda/fanfic-site-template)，这里是精简版。

      </aside>

      这是一个放同人文的个人网站模板。你现在看到的这个网站，就是用它搭出来的。

      它能做的事：首页按更新时间排作品，最新一篇放大当头条；按配对（CP）和系列整理作品；多章作品一章一页，顶部可以直接跳到任意一章；章前章后的作者注排成一块小字，和正文分开。电脑和手机都好看，有深色模式、阅读进度条、字数和阅读时长，中文字体也可以换。

      搭这个网站**不用会写代码**，全程在网页上点点就行。网站免费放在 GitHub Pages 上，不用买服务器。以后写文、改设置都在一个网页后台里完成。作品文件存在你自己的 GitHub 仓库里，随时可以打包下载。

      要先知道的几件事：

      - 免费的 GitHub Pages 要求仓库是公开的，别人在 GitHub 上能看到你的原始文件。想用私有仓库，可以改用 Cloudflare Pages（README 的「进阶」里有步骤）。
      - 后台是英文界面，不过要点的按钮不多，下面都会写清楚。
      - 第一次设置要跟着步骤点十几下，大概半小时。之后就只是写文了。

      接下来一章讲一件事：先建站，再打开后台改设置，然后写第一篇作品。已经有很多写好的文，可以看「一次导入很多篇」。

  - title: 建站
    body: |
      只需要一个免费的 GitHub 账号，不用装任何软件。还没有的话，先到 [github.com/signup](https://github.com/signup) 注册。

      ## 复制一份自己的网站

      1. 登录 GitHub，打开[模板页面](https://github.com/locoda/fanfic-site-template)。
      2. 点右上角绿色的 **Use this template**，再点 **Create a new repository**。
      3. **Repository name** 填一个英文名字，比如 my-fanfic。它会出现在网址里，以后改起来麻烦，想好再填。
      4. 选 **Public**（公开），点 **Create repository**。

      现在你有了一份自己的网站，之后的修改都在这一份里，不会影响模板。

      ## 让网站上线

      1. 在你的仓库页面点上方的 **Settings**，左边选 **Pages**。
      2. **Source** 选 **GitHub Actions**。
      3. 点仓库上方的 **Actions**，左边选「部署到 GitHub Pages」，点右边的 **Run workflow**，再点一次 **Run workflow**。刚建仓库时它已经自动跑过一次，那时还没打开 Pages，所以显示失败，不用管，重新运行就好。
      4. 等一两分钟，出现绿色的 ✓ 就成功了。

      你的网站网址是「用户名.github.io/仓库名」。比如用户名是 alice、仓库名是 my-fanfic，网址就是 alice.github.io/my-fanfic。

  - title: 打开后台，改设置
    body: |
      网页后台用的是 Pages CMS，用 GitHub 账号登录。

      ## 打开后台

      1. 打开 [app.pagescms.org](https://app.pagescms.org)，用 GitHub 登录。
      2. 第一次用会让你安装 Pages CMS 的 GitHub App，选「只允许访问」你的网站仓库就好。
      3. 回到 Pages CMS，在列表里点你的仓库。

      左边会出现「作品」「网站设置」「批量导入」三个入口。想让朋友帮忙改文，可以在 Pages CMS 里用邮箱邀请，对方不需要 GitHub 账号。

      ## 改网站设置

      点 **网站设置**，里面分三组：

      - **网站信息**：站名、作者名、网站简介、页脚链接（比如你的 AO3、微博主页）。
      - **显示设置**：中文字体、深色模式、每页几篇作品，还有首页头条、首字放大、文末 ♦、阅读进度条这些效果，不喜欢就取消勾选。
      - **作品设置**：作品标题下显示哪些信息（署名、连载状态、更新日期、字数、阅读时长），要不要允许读者复制正文，文末要不要推荐同配对的作品。

      改完点右上角保存，一两分钟后网站上就能看到变化。

  - title: 写第一篇作品
    body: |
      先在 **作品** 列表里把示例作品删掉：点作品右边的 ⋮，选删除。

      然后点右上角的 **＋** 新建作品：

      1. **作品名**：必填。网址会按作品名自动生成。
      2. **CP**：点「Add an item」加一个，有几个加几个。同一个 CP 每次都写成一模一样的名字，网站才会把它们归到一起。
      3. **更新日期**：决定作品在首页的先后，新的在前。默认是当天。
      4. **简介**：不填的话，列表里显示正文开头。
      5. **系列**：名字写得一模一样的作品会自动归成一个系列，「系列里的第几篇」决定顺序。
      6. **连载状态**：连载中 / 已完结，不填就不显示。
      7. **章节**：每一章是一张卡片，有「章节名」和「正文」两格。多章作品点「Add an item」加一章，拖动卡片左边的 ⠿ 调顺序。单章作品只留一张，章节名可以不填。

      点保存，等一两分钟刷新网站就能看到。

      ## 正文怎么写

      段落之间空一行就是分段。文字两边各加两个星号是**粗体**，各加一个星号是*斜体*。单独一行写三个星号是场景分隔，显示成一个 ♦，就像下面这样。

      ***

      作者注写在一章的开头或结尾，网站上会排成一块小字，和正文分开，这一篇第一章开头那块就是。写法要用到一小段网页代码，照着 README「正文怎么写」里的样子复制过去，把中间的字换成你的就行。写在章末的话，把里面的「作者注」换成「章末注」。

  - title: 一次导入很多篇
    body: |
      已经写好的文可以直接上传，不用一篇篇复制粘贴。支持 Word（.docx）、.txt 和 Markdown（.md）。

      1. **先改文件名**：文件名就是作品名，比如「迷路指南.docx」。
      2. **打包成一个 zip**：后台一次只能传一个文件，所以很多篇要先打包。选中文件，右键压缩（Mac 是「压缩」，Windows 是「发送到 → 压缩文件夹」）。只有一篇的话直接传也行。
      3. 在后台左边点 **批量导入**，把 zip 传上去。这时还不会导入，可以接着传别的。
      4. 都传好了，点页面上方的 **开始导入**。弹出的框里可以填这一批共用的配对、系列、连载状态、更新日期，都可以不填。
      5. 等两三分钟，作品就出现在列表和网站上了。

      怎么分章：Word 用「标题 1」样式的段落当章节名；txt 里单独一行写「第一章」「第二章：重逢」「番外」这样的就会分章；Markdown 每章前面写一行「# 章节名」。没有分章标记的，整篇就是一章。

      有文件没导入成功的话，它会留在「批量导入」里，旁边多一个「_导入失败说明.txt」，打开就能看到原因。最常见的是已经有同名作品：为了不覆盖你改过的内容，同名的不会导入。

  - title: 备份和常见问题
    body: |
      ## 备份全部作品

      到 GitHub 仓库的 **Actions** 页面，左边选「导出作品」，点 **Run workflow**。几分钟后在仓库的 **Releases** 页面能下载一个 zip，里面每篇作品一个 Markdown 文件，任何文本编辑器都能打开。默认是草稿，只有你自己能看到。

      ## 保存之后网站没变？

      网站要重新生成，通常一两分钟。过了很久还没变，到仓库的 **Actions** 页面看最新一次「部署到 GitHub Pages」是不是红色的 ✗，点进去能看到原因，大多是哪篇作品的格式有问题。出问题时网站会保持上一版，读者不受影响。

      ## 能用自己的域名吗？

      可以。仓库 **Settings** → **Pages** → **Custom domain** 填上你的域名，再按提示去域名服务商那里设置。国内访问 github.io 有时不稳，绑自己的域名或者改用 Cloudflare 会好一些。

      ## 还有问题

      看模板的 [README](https://github.com/locoda/fanfic-site-template)，里面有更完整的说明。
