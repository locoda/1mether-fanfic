- title: 末班车
  body: |
    <aside class="author-note" aria-label="作者注">

    我只是loss得太厉害了！！全是我编的！！呜呜

    </aside>

    明明一个小时前就在大前辈的生日会上说要去赶末班车而提前离场，可此时此刻佐藤大树却还在神户，在一个登记的名字不是他的酒店房间里。浴缸还放在着水，他穿着没换下的短袖，闭着双眼躺在今天刚整理过的床铺上。

    门外的脚步声越来越近，房卡滴的声响之后是解锁的机械音。房间的主人一边在关门一边没头没尾地说：“加上你名字了，不过你不去前台的话不给房卡”。佐藤大树点了点头，不过他的位置站在房间门口的人看不见，于是佐藤大树又听到他继续说，“不过你也不需要房卡吧，一早就走了。”房间太小了，这句话说完的时候，声音已经到他头顶了。

    佐藤大树又点了点头，没出声，甚至连眼睛都没睁开。山本世界的温度离开床边，踩上浴室的台阶，踩到地砖上声音变了，水流声停止了。再响起的说话声又在头顶，“水都放满了，你去泡吧。”佐藤大树发出了鼻音，听不出是嗯还是哼，但总归是答应了。山本世界伸手推了推在床上不动的人的身体，感受到一丝阻力，又说“再不去水就要凉了。”还是没动作，加重语气，“你再不动我要动手把你抱过去了哦？”

    佐藤大树听到这话翻了一下，躺在一个动作就能下床的姿势，用人类根本没法听清的声音挤出几个音节，山本世界觉得那应该是再等一下的意思。不急着动作，山本世界问是不是累了，佐藤大树点头。

    山本世界有点庆幸自己今晚把这个家伙拦了下来。这个在别人面前永远不知道疲倦的人，还说是明天早上还有工作所以今天要回到东京，在新干线上休息一下就行。结果把人带回酒店的路上已经累的好像要在走路的时候睡着了，短短一站电车他都几乎要进入梦乡，一进了房间就再也没法站起来，化成一滩流体。明明已经入行十多年了，还是永远只想着下一个行程，这样热爱工作的人世界上也找不出几个来。

    山本世界又戳了戳他的手臂，佐藤大树发出了拒绝的哼声。山本世界弯下腰伸手搂过他，想让他借自己的力起来，可佐藤大树一点不领情，就这样死死粘在床上。这可就没办法了，山本世界把手插进他的身体和床铺之间，把手环起来，然后一用力，把佐藤大树的上半身从床上剥离了起来，自然得到了一顿含糊不清的抗议。山本世界不打算搭理他，直起身子把人拉了起来，然后迅速松开一只手，似乎是要趁着他没注意，把那只手插进他的膝盖后面。再一提，整个人就被抱起来了。佐藤大树的抗议手段已经只有声音而已，他没有乱动破坏山本世界的平衡，反倒是收缩了下身子，让自己的重心更靠近山本世界的身体。

    “明明就没喝醉”，山本世界嘴里也嘟嘟囔囔的，“明明到浴室就两步路，洗澡水还是你自己打开的”，一边抱怨一边也走到浴室了，“想撒娇也要有个限度吧？”感觉到怀里的人在摇头，山本世界说，“至少自己脱衣服吧！”

    佐藤大树就这样被放在了浴缸的边上，自己找到了平衡——他当然能自己找到，毕竟没有醉，也没有累到动不了。山本世界没有转身离开，监视着他脱下自己的衣服裤子，然后看着他慢慢把自己放进放满了水的浴缸里，速度控制得刚刚好，水不至于一下溢出来，只是随着他的动作一点点从防溢口流走合适的程度，直到他脖子以下的部分都泡进了水里。

    “你不泡吗？”佐藤大树闭上自己的双眼，问这个房间里仅有的另一个人。

    “等你泡完吧。”

    佐藤大树把脸浸到水里。“好”的声音模模糊糊地从水面之下传来。

    连续三天的演唱会任谁都不可能不累的，又不是只有20岁的那个时候，那个当初一直跟在自己身后叫老师老师的人也已经30岁了。山本世界想着等他泡完澡一定要跟他好好说，要他注意自己的身体，过了30岁可就不能和以前一样不顾自己死活地工作了。明明一场演唱会要消耗四千大卡是他自己说出来的话，那就不要再三天演唱会之后立刻安排工作，至少好好休息一天吧——不不不，只休息一天也是不够的吧？

    虽然是这样想，但山本世界仅仅是躺到床上，连手机都没拿出来，就发现自己眼皮沉到根本无力反抗。在陷入睡眠的前一秒，山本世界想佐藤大树要是在浴缸睡着就不好了。

    糟糕的事情并没有发生，泡完澡的佐藤大树戳醒了山本世界，还在吹头发的时候给他放好了洗澡水。佐藤大树看山本世界终于有了反应，问他要不要洗澡。山本世界分不清是现实还是梦境，迷糊地回答说不想动。佐藤大树说好吧，那你往里睡一点吧。山本世界翻了一整圈几乎是到了床的另一边，然后感觉到床上有另一个人的晃动，才确信自己的感触还在现实世界。随后还带着吹风机余温的头发蹭到自己的脖子里，山本世界无意识地伸手环住怀里的人把人拉到靠近自己一点的地方。

    “明天几点走？”山本世界不清楚自己说得能不能让人听懂。

    “首班车。”

    “太累了吧？”

    “怪你让我错过末班车。”

    佐藤大树说话时吐出的气在两个人之间好像不会散去，山本世界在睡梦和清醒的界限上，好像几个呼吸会把那话语吸进肺里重新刺激思考。佐藤大树以为他不会回答了，伸手搂住山本世界的后背，从上往下慢慢滑过去，做这件每一天站在他身后时最想做的事情。

    他感觉到山本世界的怀抱比刚才更紧了一些，然后他听到山本世界如梦一样的呓语，“我才是你回家的末班车。”

    END.
