  - title: 秋夜
    body: |
      <aside class="author-note" aria-label="作者注">

      这是模板自带的示例作品：鲁迅《野草》中的三篇（1924—1925），已进入公有领域，用来展示多章作品、作者注和章节导航。<br>开始写自己的作品前，在网页后台把三篇示例作品删掉就好。

      </aside>

      在我的后园，可以看见墙外有两株树，一株是枣树，还有一株也是枣树。

      这上面的夜的天空，奇怪而高，我生平没有见过这样的奇怪而高的天空。他仿佛要离开人间而去，使人们仰面不再看见。然而现在却非常之蓝，闪闪地䀹着几十个星星的眼，冷眼。他的口角上现出微笑，似乎自以为大有深意，而将繁霜洒在我的园里的野花草上。

      我不知道那些花草真叫什么名字，人们叫他们什么名字。我记得有一种开过极细小的粉红花，现在还开着，但是更极细小了，她在冷的夜气中，瑟缩地做梦，梦见春的到来，梦见秋的到来，梦见瘦的诗人将眼泪擦在她最末的花瓣上，告诉她秋虽然来，冬虽然来，而此后接着还是春，胡蝶乱飞，蜜蜂都唱起春词来了。她于是一笑，虽然颜色冻得红惨惨地，仍然瑟缩着。

      枣树，他们简直落尽了叶子。先前，还有一两个孩子来打他们别人打剩的枣子，现在是一个也不剩了，连叶子也落尽了。他知道小粉红花的梦，秋后要有春；他也知道落叶的梦，春后还是秋。他简直落尽叶子，单剩干子，然而脱了当初满树是果实和叶子时候的弧形，欠伸得很舒服。但是，有几枝还低亚着，护定他从打枣的竿梢所得的皮伤，而最直最长的几枝，却已默默地铁似的直刺着奇怪而高的天空，使天空闪闪地鬼䀹眼；直刺着天空中圆满的月亮，使月亮窘得发白。

      鬼䀹眼的天空越加非常之蓝，不安了，仿佛想离去人间，避开枣树，只将月亮剩下。然而月亮也暗暗地躱到东边去了，而一无所有的干子，却仍然默默地铁似的直刺着奇怪而高的天空，一意要制他的死命，不管他各式各样地䀹着许多蛊惑的眼睛。

      哇的一声，夜游的恶鸟飞过了。

      我忽而听到夜半的笑声，吃吃地，似乎不愿意惊动睡着的人，然而四围的空气都应和着笑。夜半，没有别的人，我即刻听出这声音就在我嘴里，我也即刻被这笑声所驱逐，回进自己的房。灯火的带子也即刻被我旋高了。

      后窗，结构：⿱穴⿴囗夕的玻璃上丁丁地响，还有许多小飞虫乱撞。不多久，几个进来了，许是从窗，结构：⿱穴⿴囗夕纸的破孔进来的。他们一进来，又在玻璃的灯罩上撞得丁丁地响。一个从上面撞进去了，他于是遇到火，而且我以为这火是真的。两三个却休息在灯的纸罩上喘气。那罩是昨晚新换的罩，雪白的纸，折出波浪纹的叠痕，一角还画出一枝猩红色的栀子。

      猩红的栀子开花时，枣树又要做小粉红花的梦，青葱地弯成弧形了。……我又听到夜半的笑声，我赶紧砍断我的心绪，看那老在白纸上的小青虫，头大尾小，向日葵子似的，只有半粒小麦那么大，遍身的颜色苍翠得可爱，可怜。

      我打一个呵欠，点起一支纸烟，喷出烟来，对着灯默默地敬奠这些苍翠精致的英雄们。

      （一九二四年九月十五日。）
  - title: 好的故事
    body: |
      灯火渐渐地缩小了，在预告石油的已经不多；石油又不是老牌，早熏得灯罩很昏暗。鞭爆的繁响在四近，烟草的烟雾在身边：是昏沈的夜。

      我闭了眼睛，向后一仰，靠在椅背上；捏着《初学记》的手搁在膝髁上。

      我在朦胧中，看见一个好的故事。

      这故事很美丽，幽雅，有趣。许多美的人和美的事，错综起来像一天云锦，而且万颗奔星似的飞动着，同时又展开去，以至于无穷。

      我彷佛记得曾坐小船经过山阴道，两岸边的乌桕、新禾、野花、鸡、狗，丛树和枯树，茅屋，塔，伽蓝，农夫和村妇、村女，晒着的衣裳，和尙、蓑笠、天、云、竹、……都倒影在澄碧的小河中，随着每一打桨，各各夹带了闪烁的日光，幷水里的萍藻游鱼，一同荡漾。诸影诸物：无不解散，而且摇动，扩大，互相融和；刚一融和，却又退缩，复近于原形。边缘都参差如夏云头，镶着日光，发出水银色燄。凡是我所经过的河，都是如此。

      现在我所见的故事也如此。水中的青天的底子，一切事物统在上面交错，织成一篇，永是生动，永是展开，我看不见这一篇的结束。

      河边枯柳树下的几枝瘦削的一丈红，该是村女种的罢。大红花和斑红花，都在水里面浮动，忽而碎散，拉长了，缕缕的胭脂水，然而没有晕。茅屋、狗、塔、村女、云、……也都浮动着。大红花一朶朶全被拉长了，这时是泼剌奔迸的红锦带。带织入狗中，狗织入白云中，白云织入村女中。……在一瞬间，他们又将退缩了。但斑红花影也已碎散，伸长，就要织进塔、村女、狗、茅屋、云里去。

      现在我所见的故事淸楚起来了，美丽，幽雅，有趣，而且光明。青天上面，有无数美的人和美的故事，我一一看见，一一知道。

      我就要凝视他们。……。

      我正要凝视他们时，骤然一惊，睁开眼，云锦也已皱蹙，凌乱，彷佛有谁掷一块大石下河水中，水波陡然起立，将整篇的影子撕成片片了。我无意识地赶忙捏住几乎坠地的《初学记》，眼前还剩着几点虹霓色的碎影。

      我真爱这一篇好的故事，趁碎影还在，我要追回他，完成他，留下他。我抛了书，欠身伸手去取笔，——何尝有一丝碎影，只见昏暗的灯光，我不在小船里了。

      但我总记得见过这一篇好的故事，在昏沈的夜……。

      （一九二五年二月二十四日。）
  - title: 雪
    body: |
      暖国的雨，向来没有变过冰冷的坚硬的灿烂的雪花。博识的人们觉得他单调，他自己也以为不幸否耶？江南的雪，可是滋润美艳之至了；那是还在隐约着的青春的消息，是极壮健的处子的皮肤。雪野中有血红的宝珠山茶，白中隐青的单瓣梅花，深黄的磬口的蜡梅花，雪下面还有冷绿的杂草。胡蝶确乎没有；蜜蜂是否来采山茶花和梅花的蜜；我可记不真切了。但我的眼前仿佛看见冬花开在雪野中，有许多蜜蜂们忙碌地飞着，也听得他们嗡嗡地闹着。

      孩子们呵着冻得通红，像紫芽姜一般的小手，七八个一齐来塑雪罗汉。因为不成功，谁的父亲也来帮忙了。罗汉就塑得比孩子们高得多，虽然不过是上小下大的一堆，终于分不淸是壶卢还是罗汉，然而很洁白，很明艳，以自身的滋润相黏结，整个地闪闪地生光。孩子们用龙眼核给他做眼珠，又从谁的母亲的脂粉奁中偸得胭脂来涂在嘴唇上。这回确是一个大阿罗汉了。他也就目光灼灼地嘴唇通红地坐在雪地里。

      第二天还有几个孩子来访问他；对了他拍手，点头，嘻笑。但他终于独自坐着了。晴天又来消释他的皮肤，寒夜又使他结一层冰，化作不透明的水晶模样，连续的晴天又使他成为不知道算什么，而嘴上的胭脂也褪尽了。

      但是，朔方的雪花在纷飞之后，却永远如粉，如沙，他们决不黏连，撒在屋上，地上，枯草上，就是这样。屋上的雪是早已就有消化了的，因为屋里居人的火的温热。别的，在晴天之下，旋风忽来，便蓬勃地奋飞，在日光中灿灿地生光，如包藏火燄的大雾，旋转而且升腾，弥漫太空，使太空旋转而且升腾地闪烁。

      在无边的旷野上，在凛冽的天宇下，闪闪地旋转升腾着的是雨的精魂……

      是的，那是孤独的雪，是死掉的雨，是雨的精魂。

      （一九二五年一月十八日。）

