title: 选择之前
cp:
- 直刚
updated: 2022-09-06
chapters:
- title: 第 1 章
  body: |
    “真好啊，昨晚你想离开就离开了。如果是Alpha或者Omega的话，在那个时候已经没有办法走掉了吧？不过作为Beta还要参与那样的酒局，也是难为你。”TAKAHIRO明明有自己的休息室，却非得在彩排过后经过NAOTO的身边提到昨晚的事情。NAOTO怎么又听不出来，这话可不是真的为了关心他。

    “前辈也不用这么担心我，酒局也是我自己要来的。”NAOTO扯起了一个笑容，“真是让前辈见笑了，在新人面前失态了。”

    TAKAHIRO拍了拍NAOTO的肩膀，“是正常的啦，你和刚酱本来就认识，和NAOKI也熟悉，确实会动摇。”

    “嗯，没事的前辈，我没事的。”NAOTO尝试用最普通的语气去说这句话，他不知道自己成功了几分。

    NAOKI朝这边走过来了，TAKAHIRO和他挥手打了个招呼，就从NAOTO身边离开了。其他人陆陆续续都离开了，留下这两个三代目的队长在偌大的表演者共用的休息室里，却连一个对视都没有。因为刚才和TAKAHIRO的对话，NAOTO换衣服的动作比平日慢了点，此刻身上还黏着湿透的衣服。他倒是不介意在NAOKI面前换衣服，今天也是。于是NAOTO自顾自地脱下了湿掉的衣服，从包里拿出干净的换替换衣服，企图忽略掉通过镜子也能感受到的目光。

    “经纪人说在门口了，刚酱好像已经去车上了。”NAOKI从手机上把头抬起来的时候，NAOTO已经把衣服穿好了。纯色的T恤把他的线条遮挡了起来，NAOKI移开了自己的目光，随后像往日一样往他身边靠了一步，没料想NAOTO却往后退了一步，和他拉开了半个人的距离。

    “嗯。”NAOTO的话是朝着地板说的，声音有点闷。

    接下来的行程是回公司去开三代目的企划会议，所以三个人被安排在了一辆车里。NAOTO比NAOKI先上了车，没多想就随便坐下了，结果看到正在上车的NAOKI皱了皱眉头。

    “能坐前面吗？”NAOKI转头问在驾驶座的经纪人。

    “哦？为什么？”，经纪人的头从前排的座位中间探出来，看到NAOKI复杂的表情又决定不再追问，“也行吧……”随后就示意NAOKI把占据了副驾的包挪到后座，把副驾让给了NAOKI，还不忘叮嘱：”你都坐这了记得盯着点导航。“，直到看到NAOKI点了头，才松开了手刹、挂档、踩下油门。

    NAOTO在运转的汽车里看手机，突然觉得有点头晕。

    是晕车吧？NAOTO想。

    是晕车的话，头晕、恶心都是完全正常的。NAOTO转头去看窗外，但是已经泛起的恶心没有那么快消褪。NAOTO感谢自己空空的胃袋，晕车的感觉能被圈在脑中，不会从嘴中漏出。

    只是，不知道为什么自己不在车上的时候也会晕车。

    车里比往日安静，三个人各怀心事。会在两个团队一起活动，会一起活动很久，可能根本就不会再有分开的那一天，但是也只有在远离不管是哪个队的队友的时候，才能不顾他人的眼光反刍所发生的事情。经纪人只当这安静是因为大家都累了，说了句“今天也辛苦了”，没能得到回应，就不再多嘴。

    人类的大脑是很神奇的东西，像是这个没有话语的间隙，属于NAOTO的粉色大象是昨夜在地下二层的所谓“酒局”发生的事情。只要大脑空闲下来，粉色大象就会挤进来，占据所有的空间，越不想去想粉色大象便越容易想起粉色大象，睁开眼的时候是这样，闭上眼的时候也是这样。NAOTO盯着窗外的风景看，试图让自己追上车的运转速度，但是眼前浮现的景色依然是那张巨大的圆桌——圆桌上的人、圆桌下的人。

    那些都是和自己不一样的人。

    算起来第四章开启已经有接近半年，在玩笑话间前辈们说着“终于会多两个Omega了”、“TETSUYA这这下终于稍微轻松些了”、“会是三个吧，再等个几个月大树就成年了”的时候，NAOTO当时并没有觉得恶心，只想着已经分化成Omega的刚酱不得不进入这个地方的日子能再晚一点就好。拖到不能再拖，第四章的新成员除了岩田刚典之外也只剩下还未成年的佐藤大树没被带进这个地方了，终于也算是拖到了昨天。

    所以昨天就是那个日子，那个岩田刚典被带上圆桌的日子。

    NAOTO有自己的行程，结束得早就早点来到了会场，抵达的时候其他人都还没来，他就和往日似的在桌边玩着手机，和进来的人一个个打了招呼。还在有说有笑的阶段，每个人都少不了问一句“刚酱怎么没跟着你来？”，于是NAOTO只好一遍遍回答“我也有自己的行程啦”。岩田刚典是跟着NAOKI来的，两人刚推门进来TETSUYA就迎了过去，说着“我带你去准备准备”就把人带到了侧边的隔间中，NAOKI像是往日一样坐到NAOTO身边的座位上。

    “你不担心刚酱吗？”NAOTO觉得奇怪，忍不住开口问他。

    “刚酱又不是才刚刚分化“，NAOKI没看着NAOTO说话，视线反而一直落在圆桌中间，“正常的发情期也经历过了，不会出什么事的吧。”

    “哦……“NAOTO不是很确定自己完全明白了NAOKI的所指，但脑海中却自顾自地对比起TETSUYA在自己面前分化成Omega的时候和白滨亚岚被带上圆桌的时候不太相同的状态，下意识地点了点头。

    刚被TETSUYA带出来的时候，其他人都已经到场了，甚至TAKAHIRO已经开始发出了“他们俩怎么花了这么久”的小声抱怨——尽管谁都看得见白滨亚岚的那颗头在他身下起起伏伏。NAOTO一眼就看到了刚头顶装饰用的狗耳朵和身后长出的狗尾巴，下一刻才注意到他的下半身已经一丝不挂，全身只剩下了一件薄薄的T恤，身材已经完全展现在其他人的面前。他脸上泛着NAOTO从没有见过的潮红，眼皮下垂着，是有点害羞的样子。

    或许对刚酱是有那么一瞬间的情动的。NAOTO后来想。

    TETSUYA身手敏捷地爬上了他数不清上过多少次的圆桌，随后伸出手把刚也拉了上去，然后带着刚走到了圆桌的中间，直到把他引导到了圆桌正中心有个小小交叉点的地方。TETSUYA对着刚说了一句“你自己站好”，然后才离开了他两步，从口袋中掏出一个遥控器，抓着挂绳在手里晃了两下，然后清了清嗓子，“大家觉得这个遥控器的归属该怎么办？”NAOTO不知道是不是自己的错觉，刚的脸一时间更红了一点。

    TAKAHIRO发现正餐已经上桌了，拍了拍身下白滨亚岚的头，直到他从桌子里钻了出来，脚步不稳地走到了一边自己的座位上去，TAKAHIRO才继续问桌上的人：“刚酱第一次就要玩这么大？”

    “不知道是谁摆在更衣室的道具，觉得很合适就给刚酱穿上了。”TETSUYA似乎是带着满意的神色上下打量了刚一番。

    “不如这样吧，把这个选择权交给刚好了。”TAKAHIRO的脸上拉出了一个笑容，NAOTO觉得自己脊背像是被冰块擦过一样突然冒出了冷气，“我们随便放一首歌，让刚酱跳个舞，大家也都想看刚跳舞的吧，毕竟跳得很好呢。”TAKAHIRO停顿了一下，看刚脸上露出了疑惑的表情才继续说道，“然后跳舞的时候，你可以自己把遥控器扔出去，谁接到这个遥控器就归谁——当然你捏在自己手里想自己多玩一会儿我也不会阻止啦，不过音乐结束的时候，它最好是在别人的手上哦。”

    是不是有点太过分了？NAOTO刚想说，却听到身边的前辈们发出了“啊，这个主意不错”、“毕竟我们这边也是自愿为主的场合嘛”、“年轻人确实会玩啊”的赞叹，NAOTO的话被憋回了心里。抬起头看向刚，刚好眼神有一瞬的交接，NAOTO从刚的眼睛里读出了求助的意味。他眼睛已经开始染上情欲的水汽，反而比平日里更楚楚动人了一点。

    “喂，NAOKI，你觉得我能拿到这个遥控器吗？”NAOTO压低声音问。

    “那也得他想抛给你”，NAOKI低声回答道，“没准他自己有别的想法呢。”

    随着TETSUYA把遥控器塞到刚的手里，音乐几乎下一刻就在房间里响了起来。TETSUYA飞一样地滑下了桌子，二话不说坐到了坐KENCHI的怀里，仰头就揽着KENCHI的脖子开始和他接吻——NAOTO注意到他的脸似乎比刚才红了不少。依照往日的经验，NAOTO知道大概是房间里的信息素浓度开始变高的信号，他又转过头去看桌上的刚，随着音乐的响起，他调动着身体的肌肉随着节拍起舞，刚才还觉得是洁白的皮肤已经染上红色，开始被薄薄的汗珠覆盖。

    NAOTO看过刚跳舞千百次，但他却是第一次看到刚尝试做地板动作却无法成功，腿的力量没有办法支撑起自己的身体，手也渐渐软了下去。音乐还没停，但刚的动作已经逐渐无法被称之为舞蹈了。刚好像是突然醒悟那个遥控器还在自己手里似的，用尽力气抬起头看到了NAOTO望向自己的目光，把遥控器从桌上滑到了NAOTO面前。

    “啧，真是个聪明的小孩。”TAKAHIRO的声音响了起来，“喂，TETSUYA，别忘了正事儿。”，但此时TETSUYA却已经陷入了和KENCHI的性事中，胸口起伏着，下体和下体碰撞着，眼里都只有对方的样子。TAKAHIRO皱了皱眉头，“亚岚，你知道接下来要做什么吧，今天你去吧。”

    白滨亚岚其实也快站不稳了，但是他可没有无视TAKAHIRO的勇气。从桌边抽出新的黑布条，白滨亚岚撑着自己爬上了桌子，无视岩田刚典因为被强烈信息素冲击而发出的委屈的呜咽声，把黑布条蒙过刚的双眼。

    “对不住了，刚。”白滨亚岚用黑布条的两端在刚的后脑打好结，把他几乎完全软掉的身体摆成趴的姿势，然后伸出手捏住他尾巴看了一眼刚的后穴。此时刚的后穴已经几乎完全是能够供人使用的状态了，情液顺着肛塞止不住地往外流，毛绒绒的尾巴根部已经因为液体变成了一簇一簇的。白滨亚岚在下桌之前抓着那根尾巴轻轻摇了几下，刚的身体随着这动作开始颤抖，却没有因为动作的停下而停止颤抖。白滨亚岚和TAKAHIRO交换了一个眼神，看到对方满意的神情，才开口说，“那么前辈们，我们来看看刚的选择吧。”拍了拍刚的肩膀，白滨亚岚用别人听不见的声音低声对他说，“你最好快点选一个人。”然后才离开了圆桌之上。

    房间里的信息素已经到达了没有人能冷静面对的地步，但NAOTO从来都感受不到信息素的腥风血雨，他只能看到刚努力长大了嘴巴、胸口剧烈起伏着，尝试从空气中寻找着线索。然后他看到刚好像发现了什么似的，开始挪动自己的身体，往自己这边过来——不、不是的，NAOTO继续盯着刚看，逐渐理解了他选择的方向是NAOKI的方向。

    “NAO、NAOKI……”准确地抵达了NAOKI的面前，NAOTO不知道为什么自己可以在这环境里清晰地听见刚颤抖的声音叫着NAOKI的名字。NAOTO当时并没有觉得疑惑，只是觉得自己担忧的心脏落了下来——刚能找到NAOKI已经是在这个地方最正确的选择了。

    “果真聪明啊。”TAKAHIRO的声音从远方传来，NAOTO已经没有心思去管这位前辈在说什么了，毕竟眼前的景象完全吸引住了他的目光。

    刚几乎是用尽了全身的力气才爬到了桌子边上，因为控制不住身体稍稍滑出了圆桌一些，双手掉出了圆桌的范围却又使不上力气，平衡自己变得更困难，身体又渐渐往外滑出了一点点。NAOKI原本是躺在椅子上的，看到刚的样子，直起身子用双手去接他。刚在接触到NAOKI身体的时候像是在未知的泥沼中抓住了那根能救命的稻草，一瞬间就把身体的重心托付给了他。NAOKI自然没有辜负他的期待，离开了椅子压低了重心，稳稳地接住了因为重心转移而掉下圆桌的刚，带着他坐到了自己的座椅上。

    刚明明都已经没有力气了，却还是在NAOKI的怀里伸直了脖子去索求一个吻。NAOKI低下头去吻刚，从唇的交融到舌的交融，NAOTO知道自己现在或许不应该看着他们，却没有办法移开目光。NAOKI抬起右手去解开刚眼睛上的黑布条，左手用力拦住刚的肩膀，人开始往后倾斜，把刚的身体往自己的身体上方带过去，直到刚的重心稳稳落在自己的身上。丢开黑布条了之后，亲吻短暂地停了一秒，NAOKI和刚的视线这才第一次相交，但NAOTO不知道为什么觉得这眼神粘稠地像是可以拉出丝线似的，连他一个旁观者都可以感受到那种炙热。接吻似乎调动起了两人更多的情欲，NAOKI的下体已经能透过裤子看到清晰可见的轮廓，而刚开始忍不住扭动自己的腰肢，想用摩擦来缓解自己的情热。只是身体外部的摩擦没有什么成效，只会觉得越来越难受，正在接吻的嘴里发出含糊的呜咽声，而下体流出的液体已经开始润湿NAOKI的裤子。这时NAOKI松开了嘴，轻声对刚说，“好好呼吸。”，然后手慢慢从肩膀往下移到刚的腰部，用更稳定的姿势搂住他把他固定在自己身上。

    “打开遥控器吧，刚酱现在很需要。“NAOTO听到NAOKI用冷静的语气对自己说，但他的身体却行动不了。

    NAOKI向来都是这么温柔的人吧？NAOTO想。

    但是，在这之前的无数次交合中，NAOKI有用这样的眼神看过我吗？

    NAOKI在和我接吻的时候也会闭上眼睛的吗？

    NAOKI在抱我的时候有抱得这么紧过吗？

    NAOTO最终也没有能摁下遥控器的按钮，甚至没能把遥控器交到NAOKI手里，只是把遥控器留在了桌面上，就逃离了这个房间。
- title: 第 2 章
  body: |
    事实上，比车上的沉默更可怕的是会议室里的沉默，或许不仅仅是因为三个人的分量变成了七个人的分量。

    往日里大家总是在一起热烈地讨论的时候，NAOTO总觉得分给他们用的会议室太大了，七个人挤在一起讨论事情总是很畅快，言语能不透过扩音器直接传递到对方的耳边，情绪就不会有太多的损失，积年累月的默契也已经开始发芽，即便是争执也能用善意去解释和谅解。

    但今天对NAOTO来说则是完全不同的情形。NAOKI下车的时候丢下了一句“NAOTO你和刚酱慢慢来”，略有察觉到刚酱不对劲的NAOTO在车门口等待了一下刚酱，看到他在下车的时候好像没有稳住重心便伸手去扶，然后听到刚小声对自己说“谢谢NAO桑”。进入会议室的时候，发现留下的空位中有一个离其他成员不近，NAOTO问出“怎么了？”，刚就拍了下NAOTO的肩膀示意他别说了，而后自己走了过去。NAOTO看见房间里的其他人似乎是松了口气的样子。

    这不正常，NAOTO想。

    会议硬着头皮进行了十来分钟，直到在NAOTO尝试开启讨论的时候，登坂广臣站起来，说着“这里太闷了”去开会议室的门之后，陷入了无尽的沉默之中。到了这个时候，走廊上的温度比会议室低一点，或许是因为会议室里人更多。感受到新鲜空气进入了NAOTO鼻腔的时候，他听到今天异常沉默寡言的另一位队长NAOKI说，“不如今天先散会吧，我们可以之后LINE上再说。”

    NAOTO看着其他成员用看救星的眼神看着NAOKI，挥了挥手说散会。刚几乎是立刻起身说了句“抱歉”，就起身走出了会议室，NAOTO感受到剩下的人中有至少一半终于放松了了点。队友接二连三地离开了，NAOTO对着NAOKI使了个眼色，所以最后会议室只剩下他们两个。支开了经纪人，NAOTO才放心地开始和NAOKI说话。

    “今天是怎么回事？”NAOTO问。

    “刚的信息素到处都是。”NAOKI答。

    “啊？忘贴屏蔽贴？”NAOTO有点疑惑，刚也并非分化一两天了，而且在A多O少的公司里向来谨慎，因为信息素而影响到整个团开会还是第一次。

    NAOKI稍稍挪开了视线没有去看NAOTO的方向：“他已经贴了，但信息素还是一直往外漏。”不然你一定会发现他腺体上的刚结痂的咬痕，太刺眼了。

    NAOTO低下头想了想：“那临时标记呢？”昨天你们不是做了吗？

    “看来不太有用。彩排的时候前辈们都没有收着信息素，刚酱大概是信息素紊乱了。”

    “哦……”NAOTO知道此刻或许不该再追问了，但又实在是忍不住好奇心，“说起来，刚昨天为什么能那么准确地找到你的味道？”就连白滨亚岚这样的人，第一次上圆桌的时候也陷入了无措之中，刚能分辨出NAOKI的气息在NAOTO看来近乎是一个奇迹。

    后来NAOTO想，其实他希望NAOKI告诉自己什么都好。告诉他因为NAOKI为了帮刚提前给他闻了很多次信息素的味道也好，告诉他NAOKI用尽了全力于是在混乱的空气中胜过前辈也好，哪怕告诉他这是三代目的羁绊，他可能也会马上相信。

    “因为之前做过，我给过他临时标记，所以他生理上能分辨出我的味道。”NAOKI几乎是面不改色地说。

    “……什么？”NAOTO没有想过会是这个答案。

    “处理发情期而已。”话题被推到第二性别的生理需求上。

    “为什么是你？”

    “我是队长。”

    “我也是队长。”NAOTO燃起了一股微妙的不服输的心情。

    “但你是Beta。”NAOKI的语气同一开始一样冷静。

    这是NAOTO最讨厌的话之一。

    或许没有这个之一。

    几乎在任何时候从任何人嘴里听到这句话，NAOTO都会被从现实中抽离，回到自己刚分化的22岁——何况现在对他说出这话的面前的人是NAOKI。

    从18岁开始，NAOTO就以成为舞者为目标而努力着，日复一日地重复着打工和练舞的生活并不让他觉得绝望，反而是最充满希望的时光。尽管不曾发誓一定要站上舞台站到人前，但一天天和舞者的比拼中，他开始发现自己的能力也逐渐开始能跨入顶层的圈子，逐渐在地下也有了点知名度，会有舞者在提到“有知道什么跳的不错的家伙吗”的时候想起他的名字。跨过了20岁的门槛，开始一边教人跳舞获得稳定的收入，另一边开始能入选给明星作为巡演和大型演出的伴舞，用跳舞养活自己渐渐不成问题了。现在回想起来，刚刚成年的自己忧虑那么少，离理想的生活那么近。

    等到了跨过21岁生日，身边的人开始渐渐问起他的第二性别，NAOTO才发现这片乌云在不知不觉间已经靠近自己并笼罩在了自己的头上。从舞者变成顶级地下舞者、或是是进入演艺圈，不论走哪条路都已经只有一步之遥，但是在NAOTO还只有21岁的那个年代，第二性别是不论哪个选项的通行证——不管是地下还是地上的圈子，要成为成功的舞者必须是Alpha是大家不会摆在台面上说的共识，即便你已经证明过无数次自己可以做得很好，但其他舞者在介绍工作之前还是会问一句你的第二性别。“哦，还没分化啊，也不着急，这个时候没分化的人也还挺多的。”在知道NAOTO还没分化的时候，这些人总是会撂下一句不知道是不是安慰的话，工作自然也就没了下文。

    只要还没有分化，就总还有机会。NAOTO偶尔在演出后的酒局上喝醉的时候会表露出自己对第二性别的担忧，身边的人总是安慰他说，你跳得这么好总会是Alpha的，末了还要补上一句，就算不是Alpha，分化成Beta也能继续现在的生活，不也挺好的吗？NAOTO并不会当面对谁说不好，总是笑着点头，还说如果没分化成Alpha得继续靠你们照应了，但也只有他自己知道，野心这样东西膨胀开来之后要收回起来并不容易，继续这样的生活对他来说一定不是最好的选项。

    22岁的体检，医生带着神秘的表情走过来，告诉NAOTO说“你终于分化了哦”。NAOTO下意识地觉得这多半不是一个好消息，毕竟Alpha和Omega的分化总是来得轰轰烈烈，只是脑子还没反应过来，医生已经接着说了一句“是Beta呢，真好”。

    真好？NAOTO只觉得这话像是一把刀，从心口直直地穿透了自己，然后往下划去，绕过一个圈，把正在跳动的心脏取出来，然后血液循环缺乏了源头，就算还有意识，也迟早会因为失血过多而身亡。

    不，身亡反而是更好的结局。对那时NAOTO来说，最可怕的并不是死去，而是自己除了跳舞大概这辈子已经什么都做不了了，只能继续依靠舞蹈为生，但永远都会站在顶尖的舞台一步之外，永远都还留存着意识，知道自己跨不过第二性别的坎，然后听着那个圈子里的人对自己说，“好可惜，如果不是Beta的话……”

    灰暗的日子持续了一段时间。NAOTO减少了去地下跳舞的时间，直到不在出入往日每夜都会进入的俱乐部；与此同时，他花了更多时间在明亮的舞室里指导学生跳舞。NAOTO每天都在告诉自己，能培养出几个站上大舞台的学生也会是美好的人生，甚至要比自己站上舞台去更安定、更有保障。但谎话说一千遍也不会变成真话，NAOTO有时候会突然发现镜子里在跳舞的自己在慢慢失去活力，就像快长好的伤口让他觉得痒，自己伸手去挠又会再渗出血珠一样，因为没有心脏，所以血液总是越来越少。

    这个时候出现在他人生里的是NAOKI，是在地下有过几面之缘的舞者，是舞室的教师同僚。

    “你还想爬的更高吗？“

    那一天在舞蹈课的休息时间，NAOTO和NAOKI在厕所的洗手台遇见。NAOTO洗完手之后把冷水开到了最大，然后往自己脸上泼了一些然后再用力地拍着自己的脸，让自己更清醒一点。NAOKI看着他这一系列动作，然后又从镜子里看他有些面熟的脸，突然记起了那个在地下意气风发的NAOTO。巧合的是，NAOKI刚刚被HIRO通知说或许可以加入正在准备的组合，以后可以出道，还问他有没有其他认识的合适人选，不过NAOKI一时没有想起来。

    NAOTO掀起衣服把自己湿乎乎的脸擦干了，抬起头，花了几秒钟才记起来NAOKI是谁。NAOTO回答他，“想，但我只是个Beta。”

    “Beta又怎么样？你跳舞比有些Alpha好多了。”NAOKI的话像是从延绵不绝的乌云中努力探出头的太阳，给NAOTO的生活一缕希望。

    NAOTO并不知道NAOKI是如何向HIRO推荐了自己，也不知道他如何说服HIRO接受一个Beta。虽然后来HIRO自己的说法是“本来也是时候想招一些非Alpha的人了”，但NAOTO始终是感激NAOKI的。就算没有成功入选，NAOKI的那句话也像是一剂强心剂，不，更像是干细胞，驻扎在了身体的缺口里，顽强地尝试着修补那块地方。

    从漫长的回忆中把神智又拉了回来，NAOTO突然觉得自己有点可笑。他不知道这种感觉是来自于无法保护刚的挫败感，还是来源于直到此刻才突然察觉到NAOKI对自己有多重要的迟钝感。不论是哪份感情都无比真挚，却在此刻变得无比沉重，把NAOTO的心压了下去，甚至压进了胃里。NAOTO对比着，此刻的动摇和他第一次听闻自己是Beta时的动摇哪种感觉更强烈——或许是因为近十年前的记忆过于遥远而已经开始褪色，NAOTO觉得此刻的痛感并不少于那时。

    NAOTO忍不住想，我又是谁呢？不过是一个Beta而已，就算走到了这里，也只是一个Beta而已。

    最终是打破了沉默，“呐，NAOKI，如果可以和刚酱做的话，也可以跟我做吧？”

    在圆桌之外，在这个正常运转的世界里，Beta和Alpha也是能够交流的吧——哪怕是通过身体，也有那么一丝可能，是可以互相理解的吧？

    “为什么要做？”NAOKI反问。

    “解决生理需求。”NAOTO说着歪理。

    “你有什么生理需求？”

    “我说有就是有！”，NAOTO抬起头看向NAOKI的双眼，看到里面的无奈，“所以为什么不行？难道就因为我是个Beta吗？”

    “不是，”NAOKI皱了皱眉头，甚至摇了摇头，“是因为你是NAOTO才不行。”

    NAOTO向前走了一步，拉近了两个人之间的距离，伸手想去勾NAOKI的脖子，像是在那个房间里的时候一样，想向NAOKI索一个吻。但NAOKI却伸出手臂挡住了他的动作，眼神躲避着，说了一句，“别这样，NAOTO，我不想。”

    NAOTO像是被施了咒语似的被钉在了原地。NAOKI也只是让自己的双手垂下，没有再多说一句话。空气停滞的这一瞬间，房间里的感应灯也暗了下来，NAOTO竟觉得有点窒息。NAOKI一个跨步走到门口摁开了灯，发现NAOTO已经走回到了座位边上去拿自己的包，在NAOKI还看着他发愣的时候，NAOTO经过了他的身边，留下了一句“再见”。

    只是这个“再见”里，和NAOTO的脸上一样，不再有一点情绪。
- title: 第 3 章
  body: |
    不论是享乐还是痛苦，时间一分钟还是六十秒，一小时还是六十分钟，二十四小时构成一天，七天会变成一周。这期间的时间大家可以粉饰太平，可以等刚酱身体好些了把没有开完的会开完，可以一起吃饭、一起上班、一起排练，仿佛和以前没有任何差别。但圆桌总是会在下一周按时到来——即便前辈的嘴上说着可以不来，没有不得不去的工作也没有拒绝出席的理由。

    NAOTO在这一天决定了晚一点去。晚一点去就不会陷入选择不选择的漩涡，只需要被告知结果，自己是被排除在外也没有关系的人。NAOTO在推开门之前在门前站定，做了一个深呼吸，伸手去推门的时候依然感觉这扇门比往日要更加沉重一些。这么多年来，他好像是第一次想这扇门为什么这么重，他好像突然明白了这扇门为什么那么重。

    灯光一如既往地照在圆桌中央，NAOTO在跨进房间之后闭上了眼睛，又做了个深呼吸。房间里通风设计得不错，空气在他的鼻腔中和房间外差不多，但睁开眼去面对，就会意识到和外界空间的运转规则并不相同的事正在上演。

    视线随着光线落在圆桌中央，NAOTO没事先听说今天有新来加入的人，但桌上的不是本部成员的面孔。NAOTO想起TAKAHIRO之前用开玩笑的语气说可以带人来，却没想到真的会有人带人来。白色的光照在那人身上显得肤色比往日更白，NAOTO认出来那是佐野玲于，而在和他的身影交错在一起的是任谁也不会认错的MANDY。MANDY的手指在玲于的身后进出，嘴在玲于的胸前游走，玲于甚至连眼睛上的布条都还没有被揭走，胸椎和腰椎因为情潮离开桌面又落下、抬起又落下。

    圆桌那么硬，他不会疼吗？NAOTO忍不住想。

    TETSUYA在桌边上，但并不在KENCHI面前，而是在TAKAHIRO面前。他摆出了跪趴的姿势，把后穴展示在他人的面前，然后自己的手指在其中耕耘着。NAOTO都不用想就知道这是TAKAHIRO的坏主意，或许是为了报复上周没听话的TETSUYA，也或许是为了报复让TETSUYA深陷性事的KENCHI，又或许是单纯的想看Omega的表演，NAOTO无从得知了。

    另一边，刚想起身的KENCHI被白滨亚岚用身体按回来椅子里，强势地用身体压住KENCHI的双腿，试图去吻他。KENCHI的视线还停留在TETSUYA身上，侧过头躲开了亚岚的吻。NAOTO站得不近，但好像听见了亚岚发出“啧”的声音。

    “MANDY怎么在上面？”NAOTO差不多环视完四周，选定了白滨亚岚来解答自己的疑问，毕竟A一般不会上桌子去。

    “他可是个急性子，一看玲于发情了就跳上去了。”白滨亚岚这时换了个姿势，坐到了KENCHI的一条大腿上，一边仰着脖子摩擦着，一边把自己的腺体凑到KENCHI嘴边，又扭过头去和另一个A说话：“世、别看了，他们俩是不会那么快下来了的，我可……啊。”随着KENCHI的舌头触碰到亚岚的腺体，他全身一震，话语被打断了。

    世界显然是听到了亚岚说到一半的话，把目光从玲于身上挪开，盯着亚岚看了几秒后，起身走到了亚岚的面前，俯下身子用嘴去堵住亚岚开始发出喘息声的嘴，开始扯过亚岚的手放到自己的裆部。亚岚身后的KENCHI注意力慢慢从远处的TETSUYA身上收了回来，在他的胸腹随着深呼吸起伏之后，KENCHI的手开始在亚岚的身上游走，扯去他身上的布料。

    有人的感情放在桌上被观赏，有人的感情放在桌下被拉扯，更多人的感情被关在沉重的门外。

    NAOTO从混乱中收回目光，转移视线抵达自己确实知道但却不想面对的事情——NAOKI已经在屋边的沙发上和刚缠在了一起。站在NAOTO的位置往那看，刚背对着自己，饱满的背肌的中间脊椎拉出了一条好看的弧线，昏暗的灯光下影子也在他身上游移着，像在水里的鱼，摆动着身体去游动、任凭水光打在自己身上，仿佛不游就会死去一样地游动着。NAOTO迈开了步子往两人那边走过去，在有点嘈杂的背景音里，不需要故意放轻脚步。刚的背肌上已经印上了浅粉色的印记，不少但不重，一觉过后又会恢复光滑的样子；再往下看去屁股上的痕迹要下手更重一些，但也只是略深一点而已，走近一些了能隐约看到手掌的形状；NAOKI性器这时候已经被塞进了两瓣臀肉之间，不过仔细看的话还没有插入，只是在穴口附近上下摩擦着，蹭上了穴口的液体，偶尔在有光线的时候能看到反光。

    “玩得这么开心吗？”NAOTO已经能用手碰到刚的屁股，把手掌对上屁股上的红掌印，似乎自己的手要小上一些。刚被突如其来的触摸吓到，腰猛地一扭，上身也随之摆动，NAOKI的性器从股间抽离，头也离开了刚身体的遮挡。NAOTO看到NAOKI皱了皱眉头，显然是刚突然的动作让他出乎意料，根本没有注意到NAOTO的靠近。

    “NAOKI……桑……快进来、吧……”刚扭了扭屁股想去蹭NAOKI的性器，撒娇似的把上半身贴紧NAOKI的胸膛，根本没有管自己身后的人究竟是谁，或是想要做什么。NAOTO和NAOKI这时才对上了眼神，NAOTO清晰地读到NAOKI的眼神中闪过了一丝不确定，但又即刻被什么东西冲垮了，伸手去扶刚的屁股，抬起他一点点想要把刚的后穴对准自己的阴茎。

    看到刚的后穴因为NAOKI的动作稍微暴露在了自己眼前，NAOTO的行动比大脑转得快，三根手指一下子进入了看起来湿透了的后穴。原来Omega的后穴是这样的湿润，NAOTO为刚内里的高温感到惊讶。但同时他也并没有手下留情，三根手指绕了一圈，刚的腰也塌了下去，整个人都贴到了NAOKI身上，但却轻轻晃了晃屁股把自己的敏感点往NAOTO手指上送。没怎么费力气就戳到了软肉，后穴里涌出的液体多得往外溢出来，带着热气浸湿了掌心。

    NAOTO试图回忆起仅有的几次摸自己后穴的经验，也算不上是干涩，总还有承欢的能力——涂抹了润滑油之后自己也能享受到乐趣，只是远不及Omega的后穴诱人。NAOTO在这样的反差感中咬了咬自己的嘴唇，抬起头又看到NAOKI对自己皱了皱眉头，心中那股难受劲儿怎么也消不下去，于是专注于眼前刚的后穴，更用力地碾压着刚的那处敏感点。听着刚发出了“啊……还、还要……啊、更多……”的呻吟声，NAOTO又抬起头对上NAOKI的视线。

    “我还以为你这周不会来。”NAOKI低声说。

    NAOTO根本没有在应答NAOKI，只是自顾自地说：“我看刚酱被这样玩屁股也挺爽的，不如把刚交给我吧。”不像是开玩笑的语气。

    “别闹了……NAOTO。”

    “我可没有在闹，我是认真的。”NAOTO伸另一只手去揽刚的腰，让小臂穿到他和NAOKI之间然后在一用力把刚的抓进自己的怀里，然后稍稍抬起腰，把刚带离了NAOKI的身体。臂弯里的刚自然不愿意听话，晃动着身体想继续去靠近Alpha的躯体，但没有受到信息素影响的NAOTO在这场比拼中显然更占上风，成功地把刚酱从NAOKI身上挪开，平放到了光滑的地面上。他的身体发着热，地面却冰冷而坚硬。刚试图想侧身过来，距离冰冷的地面远一些，接触地面的面积小一些，但在NAOTO把手指从刚后穴中抽出的时候，他的身体无力地落回了地面上。刚发出了欲求得不到满足的难受喘息声，于是NAOTO没有直接离开他的身体，而是凑到了他的脸边上，给了他一个吻。NAOTO并没有想到刚的口腔里也是如此炙热，在情欲的支配下，刚的舌头在NAOTO的嘴里没有章法地胡乱摆动着，让热气也充满了NAOTO的口腔和鼻腔。NAOTO没能在吻中占据主动权，只好伸手去揉刚的耳垂，迫使他分了神，趁此机会把自己从刚的身体上抽离了出来。在刚的耳边用气声说了一句“再忍一下就好了”，NAOTO转身去寻找NAOKI的怀抱。

    NAOKI并没有阻止NAOTO做这一切，安静地坐在椅子上看着。他没有说话也没有做动作，只是目光越过NAOTO锁定着地面上的刚。随着NAOTO越来越靠近自己，NAOKI稍稍坐直了一点点，把自己从陷入沙发的状态调整为坐在沙发上的状态。尽管看起来像是个正人君子，但阴茎挺立在空气之中，无法消解的欲望横亘在两人之间。

    “NAOKI，在圆桌前你不能拒绝我。”，NAOTO面对着NAOKI坐到他的腿上去，“你是答应过我的。”

    在说话的同时，NAOTO伸出手把NAOKI的手引向自己的裤裆处，NAOKI心领神会地解开了他裤子的纽扣，给他拉下拉链，然后把他的外裤和内裤一起脱下来，伸手去摸他的后穴。NAOKI摸下去的时候摸到了和身体温度一致的粘稠的液体——NAOTO在来之前用润滑油给自己扩张了一点，不过没有扩张充分，NAOKI借着力气把手指滑了进去。NAOTO其实已经在多年的交合中习惯了身体被入侵的感觉，但还是去吻NAOKI，因为他知道这时的总能得到最温柔的吻。NAOKI一只手在他的身后摸索着，NAOTO的内部，另一只手摸过NAOTO的下颌线。NAOKI手掌的温度比NAOTO的脸要高一些，NAOTO忍不住用脸颊去蹭了蹭NAOKI的手掌。

    “很麻烦吧……还要这么认真地扩张。”吻结束的时候，NAOTO在NAOKI的耳边说道，他的身体也开始一点点热了起来，“Beta就是这点不好呢……”

